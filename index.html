<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Árvore</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* Estilo dos nós expansíveis */
        details {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #fafafa;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        summary {
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            outline: none;
        }
        /* Estilo do conteúdo dentro do nó */
        .conteudo-no {
            margin-top: 10px;
            padding-left: 20px;
            border-left: 3px solid #0066cc;
        }
        .item-link {
            margin-bottom: 10px;
        }
        .item-link a {
            color: #0066cc;
            text-decoration: none;
            margin-right: 15px;
        }
        .item-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Minha Árvore de Links</h2>

        <details open>
            <summary>📰 Notícias</summary>
            <div class="conteudo-no">
                
                <div class="item-link">
                    <strong>Banda B:</strong><br>
                    <a href="https://www.bandab.com.br/" target="_blank">Site Oficial</a>
                    <a href="https://www.instagram.com/portalbandab/" target="_blank">Instagram</a>
                </div>

                </div>
        </details>

        <details>
            <summary>🏋️ Movimentos</summary>
            <div class="conteudo-no">
                <div class="item-link">
                    <strong>Agachamento</strong> (Anotações em breve...)
                </div>
            </div>
        </details>

        <details>
            <summary>📌 Outros Links</summary>
            <div class="conteudo-no">
                <div class="item-link">
                    Espaço para mais conteúdo no futuro.
                </div>
            </div>
        </details>

    </div>

</body>
</html>
