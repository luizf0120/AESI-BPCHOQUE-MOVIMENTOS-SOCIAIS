<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AESI BPCHOQUE - ACESSO RESTRITO</title>
<link rel="icon" href="bpchq_colorido_p_0.png" type="image/png">

<style>
  :root {
    --bg-color: #000000;
    --card-bg: #0a0a0a;
    --border-color: #333333;
    --text-main: #ffffff;
    --accent-blue: #007bff;
    --accent-red: #dc3545;
    --accent-yellow: #ffc107;
    --accent-orange: #ff8c00;
    --accent-green: #28a745;
    --line-color: #555555;
  }

  body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: hidden; 
  }

  /* =========================================
     TELA DE LOGIN
     ========================================= */
  #login-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: var(--bg-color);
  }

  .login-box {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 12px;
    border: 1px solid #222;
    text-align: center;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .login-box img { width: 120px; margin-bottom: 30px; }

  .login-box input {
    width: 100%; padding: 12px; margin-bottom: 15px; background: #111;
    border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none;
  }
  .login-box input:focus { border-color: var(--accent-red); }

  .login-box button {
    width: 100%; padding: 12px; background: var(--accent-red); color: white;
    border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; letter-spacing: 1px;
  }
  .login-box button:hover { background: #b02a37; }

  /* =========================================
     PAINEL PRINCIPAL (C2)
     ========================================= */
  #app-content { display: none; padding: 20px; }

  .header-container { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px; margin-bottom: 10px; }
  .header-title { font-size: 24px; font-weight: bold; letter-spacing: 1px; display: flex; flex-direction: column; }
  .date-badge { font-size: 12px; color: #888; margin-top: 4px; font-weight: normal; }
  .connection-status { font-size: 10px; margin-top: 4px; color: var(--accent-blue); }

  .progress-wrapper { margin: 0 40px 30px 40px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .progress-info { display: flex; flex-direction: column; font-size: 14px; font-weight: bold; gap: 4px; }
  
  .action-buttons { display: flex; gap: 10px; }
  .btn-action { background: #1a1a1a; color: white; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; }
  .btn-action:hover { background: #333; border-color: #666; }
  .btn-logout { border-color: var(--accent-red); color: var(--accent-red); }
  .btn-logout:hover { background: var(--accent-red); color: white; }

  .progress-bar-bg { width: 100%; height: 10px; background: #222; border-radius: 5px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent-green); width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(40, 167, 69, 0.5); }

  .search-box { position: relative; }
  .search-input { background: #1a1a1a; color: white; border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 20px; width: 250px; font-size: 14px; outline: none; transition: 0.2s; }
  .search-input:focus { border-color: var(--accent-red); box-shadow: 0 0 8px rgba(220, 53, 69, 0.4); }
  .search-results { position: absolute; top: 45px; left: 0; right: 0; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; max-height: 400px; overflow-y: auto; display: none; box-shadow: 0 8px 16px rgba(0,0,0,0.8); z-index: 9999; }
  .search-item { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover { background: #1f1f1f; border-left: 3px solid var(--accent-red); }
  .search-item-title { font-weight: bold; font-size: 14px; color: var(--text-main); }
  .search-item-path { font-size: 11px; color: #888; margin-top: 4px; }

  .stats-container { display: flex; gap: 20px; margin: 10px 40px 40px 40px; }
  .stat-box { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
  .stat-box h4 { margin: 0 0 15px 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
  
  /* REESTRUTURAÇÃO TÁTICA DOS RANKINGS CLICÁVEIS */
  .stat-list { list-style: none; padding: 0; margin: 0; }
  .stat-list li { 
    font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; 
    align-items: center; background: #111; padding: 8px; border-radius: 4px; border-left: 2px solid #444; 
    cursor: pointer; transition: all 0.2s ease; user-select: none;
  }
  .stat-list li:hover { background: #1c1c1c; border-left-width: 4px; }
  .stat-list.top li { border-left-color: var(--accent-red); }
  .stat-list.bottom li { border-left-color: var(--accent-blue); }
  .stat-count { font-weight: bold; color: #888; font-size: 11px; background: #222; padding: 2px 6px; border-radius: 10px; }

  /* --- BALÃO FLUTUANTE DE PRÉVIA --- */
  #tooltip-preview { position: fixed; z-index: 10000; pointer-events: none; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(4px); border: 1px solid #444; border-radius: 8px; padding: 12px; color: rgba(255, 255, 255, 0.6); font-size: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); opacity: 0; visibility: hidden; transition: opacity 0.2s ease, transform 0.2s ease; transform: translateX(-10px); max-height: 300px; overflow-y: hidden; }
  #tooltip-preview.show { opacity: 1; visibility: visible; transform: translateX(0); }
  .tooltip-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: rgba(255, 255, 255, 0.4); border-bottom: 1px solid #444; padding-bottom: 4px; }
  .tooltip-list { list-style: none; padding: 0; margin: 0; }
  .tooltip-list li { margin-bottom: 5px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }

  /* --- SISTEMA DE ESTRELAS --- */
  .star-icon {
    font-size: 20px; color: transparent; -webkit-text-stroke: 1.5px #666; cursor: pointer; transition: all 0.2s ease;
    user-select: none; display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; z-index: 10;
  }
  .star-icon:hover { -webkit-text-stroke: 1.5px #aaa; }
  .star-icon.star-yellow { color: var(--accent-yellow); -webkit-text-stroke: 0; filter: drop-shadow(0 0 4px rgba(255, 193, 7, 0.4)); }
  .star-icon.star-orange { color: var(--accent-orange); -webkit-text-stroke: 0; filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.8)); transform: scale(1.15); }

  /* --- SISTEMA DE NOTAS (POST-IT) --- */
  #modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 19999; backdrop-filter: blur(2px); }
  #nota-modal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--card-bg); border: 1px solid var(--accent-red); border-radius: 8px;
    padding: 20px; z-index: 20000; width: 320px; box-shadow: 0 15px 40px rgba(0,0,0,0.9);
  }
  #nota-modal h4 { margin: 0 0 15px 0; color: var(--accent-yellow); font-size: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
  #nota-textarea { width: 100%; height: 100px; background: #111; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 6px; resize: none; outline: none; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; font-size: 13px; }
  #nota-textarea:focus { border-color: var(--accent-yellow); }
  .nota-actions { display: flex; justify-content: space-between; }
  .btn-salvar-nota { background: var(--accent-yellow); color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .btn-fechar-nota { background: transparent; color: #888; border: 1px solid #555; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
  .btn-salvar-nota:hover { background: #e0a800; }
  .btn-fechar-nota:hover { background: #333; color: #fff; }
  
  .icon-nota { font-size: 15px; cursor: pointer; margin-left: auto; color: #444; transition: 0.2s; padding: 4px; filter: grayscale(100%); }
  .icon-nota:hover { filter: grayscale(0%); transform: scale(1.1); }
  .icon-nota.tem-nota { filter: grayscale(0%); text-shadow: 0 0 10px rgba(255, 193, 7, 0.8); animation: pulsarNota 2s infinite alternate; }
  @keyframes pulsarNota { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

  /* --- CSS DA ÁRVORE --- */
  .tree-container { display: flex; flex-direction: column; gap: 20px; justify-content: flex-start; align-items: flex-start; padding: 0 40px 40px 40px; min-width: max-content; }
  .node { display: flex; flex-direction: row; align-items: center; }
  .children { display: none; flex-direction: column; justify-content: center; padding-left: 50px; position: relative; }
  .node.active > .children { display: flex; }
  
  .node > button {
    position: relative; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);
    padding: 8px 16px 14px 8px; cursor: pointer; border-radius: 8px; font-size: 14px;
    transition: all 0.3s ease; display: inline-flex; align-items: center; min-width: 220px; justify-content: space-between; white-space: nowrap; z-index: 1;
  }
  .node > button:hover { background: #1a1a1a; border-color: #666; }
  .node.active > button { border-color: #888; }
  .node.active > button::after { content: ''; position: absolute; right: -50px; top: 50%; width: 50px; height: 1px; background: var(--line-color); z-index: 0; }
  .children > .node { position: relative; padding: 8px 0; }
  .children > .node::before { content: ''; position: absolute; left: -50px; top: 50%; width: 50px; height: 1px; background: var(--line-color); }
  .children > .node::after { content: ''; position: absolute; left: -50px; top: 0; bottom: 0; width: 1px; background: var(--line-color); }
  .children > .node:first-child::after { top: 50%; }
  .children > .node:last-child::after { bottom: 50%; }
  .children > .node:first-child:last-child::after { display: none; }

  .node-progress-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 0 0 8px 8px; overflow: hidden; }
  .node-progress-fill { height: 100%; width: 0%; background-color: transparent; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.6s ease; }

  .btn-left { display: flex; align-items: center; gap: 8px; }
  .icon-circle { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; transition: 0.3s; }
  .icon-white { background: #fff; color: #000; }
  .icon-blue { background: var(--accent-blue); color: #fff; }
  .icon-red { background: var(--accent-red); color: #fff; }
  .icon-insta { background: #E1306C; color: #fff; }
  .icon-face { background: #1877F2; color: #fff; }
  .icon-link { background: #555; color: #fff; } 
  .toggle-icon { font-size: 16px; color: #888; margin-left: 10px; }
  .node > button .toggle-icon::before { content: '⊕'; }
  .node.active > button .toggle-icon::before { content: '⊖'; }

  .link-card {
    display: flex; align-items: center; gap: 8px; background: var(--card-bg);
    border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 90px 8px 8px; 
    text-decoration: none; color: var(--text-main); font-size: 14px; min-width: 250px;
    transition: 0.2s; white-space: nowrap; z-index: 1; position: relative;
  }
  .link-card:hover { background: #151515; border-color: #888; }
  .link-card.visto { border-color: var(--accent-green) !important; background: rgba(40, 167, 69, 0.05) !important; }
  .link-card.visto::after { content: '✔'; position: absolute; right: 40px; top: 50%; transform: translateY(-50%); color: var(--accent-green); font-size: 14px; font-weight: bold; }

  .stamp { position: absolute; right: 60px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--accent-green); font-family: monospace; letter-spacing: 0.5px; }
  .link-text { display: flex; flex-direction: column; }
  .link-url { font-size: 10px; color: #888; margin-top: 2px; }
  .no-children .toggle-icon { display: none; }
  .no-children .node-progress-bar { display: none; } 
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <img src="bpchq_colorido_p_0.png" alt="Brasão BPCHOQUE" onerror="this.style.display='none'">
        <input type="email" id="email" placeholder="E-mail Operacional">
        <input type="password" id="senha" placeholder="Senha">
        <button id="btn-entrar">ENTRAR</button>
        <p id="msg-erro" style="color:var(--accent-red); font-size: 12px; margin-top: 15px;"></p>
    </div>
</div>

<div id="app-content">
  <div class="header-container">
    <div class="header-title">
      AESI BPCHOQUE - COMANDO E CONTROLE
      <div class="date-badge" id="data-display">Conectando à nuvem...</div>
      <div class="connection-status" id="connection-status">Aguardando login...</div>
    </div>
    <div class="search-box" onmouseleave="window.recolherBusca()">
      <input type="text" id="campoBusca" class="search-input" placeholder="Buscar alvo/notícia..." oninput="window.realizarBusca()">
      <div class="search-results" id="caixaResultados"></div>
    </div>
  </div>

  <div class="progress-wrapper">
    <div class="progress-header">
      <div class="progress-info">
        <span>Progresso Diário Geral (Sincronizado)</span>
        <span id="progress-text" style="font-weight: normal; color: #aaa;">Carregando...</span>
      </div>
      <div class="action-buttons">
        <button class="btn-action" onclick="window.baixarRelatorio()">📄 Relatório (7 Dias)</button>
        <button class="btn-action btn-logout" id="btn-sair">Deslogar [X]</button>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="tree-container" id="raiz-arvore"></div>

  <div class="stats-container">
    <div class="stat-box">
      <h4>Mais Monitorados da Semana 🔥</h4>
      <ul id="list-top" class="stat-list top">
        <li style="color: #666; justify-content: center;">Aguardando dados...</li>
      </ul>
    </div>
    <div class="stat-box">
      <h4>Menos Monitorados da Semana ⚠️</h4>
      <ul id="list-bottom" class="stat-list bottom">
        <li style="color: #666; justify-content: center;">Aguardando dados...</li>
      </ul>
    </div>
  </div>
</div>

<div id="tooltip-preview"></div>

<div id="modal-overlay" onclick="window.fecharModalNota()"></div>
<div id="nota-modal">
    <h4 id="nota-alvo-titulo">Adicionar Alerta</h4>
    <textarea id="nota-textarea" placeholder="Digite a observação tática (ex: Protesto agendado)..."></textarea>
    <div class="nota-actions">
        <button class="btn-fechar-nota" onclick="window.fecharModalNota()">Cancelar</button>
        <button class="btn-salvar-nota" onclick="window.salvarNotaFirebase()">Gravar Alerta</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBVPuhWEddM3QH3tDCU0IPENF09Kg-_ves",
    authDomain: "aesi-movimentos-sociais.firebaseapp.com",
    databaseURL: "https://aesi-movimentos-sociais-default-rtdb.firebaseio.com",
    projectId: "aesi-movimentos-sociais",
    storageBucket: "aesi-movimentos-sociais.firebasestorage.app",
    messagingSenderId: "957926070108",
    appId: "1:957926070108:web:6673062b6e703d9e741399"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let vistosGlobais = [];
  let anotacoesGlobais = {}; 
  window.DADOS_TOTAIS = [];
  let listaTodosAlvos = []; 
  let estrelasOrigem = []; 
  let alvoAtualNota = ""; 
  let tituloAtualNota = "";

  document.getElementById('btn-entrar').addEventListener('click', async () => {
    const e = document.getElementById('email').value;
    const s = document.getElementById('senha').value;
    const msg = document.getElementById('msg-erro');
    msg.innerText = "Autenticando...";
    try { await signInWithEmailAndPassword(auth, e, s); } catch (error) { msg.innerText = "Acesso negado. Credenciais incorretas."; }
  });

  document.getElementById('btn-sair').addEventListener('click', () => { signOut(auth).then(() => { location.reload(); }); });

  onAuthStateChanged(auth, (user) => {
    if (user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('connection-status').innerText = `Operador: ${user.email} | Sincronizado 🟢`;
        iniciarSistemaC2();
    } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('app-content').style.display = 'none';
    }
  });

  function iniciarSistemaC2() {
      get(ref(db, 'estrutura_arvore')).then(snap => {
          if(snap.exists()) {
              window.DADOS_TOTAIS = snap.val();
              listaTodosAlvos = [];
              extrairTodosOsAlvos(window.DADOS_TOTAIS);
              const raiz = document.getElementById('raiz-arvore');
              raiz.innerHTML = "";
              desenharArvore(window.DADOS_TOTAIS, raiz, []);
              iniciarMonitoramentoDiario();
          }
      });
  }

  function extrairTodosOsAlvos(lista, caminhoAtual = []) {
      lista.forEach(item => {
          if (caminhoAtual.length === 0 && item.nome !== "MOVIMENTOS") return;
          const novoCaminho = [...caminhoAtual, item.nome];
          if (item.links && item.links.length > 0) {
              item.links.forEach(link => {
                  const pathString = novoCaminho.join(' > ');
                  const idUnico = pathString + " > " + link.url;
                  listaTodosAlvos.push({ 
                      id: sanitizarId(idUnico), 
                      titulo: novoCaminho.slice(-2).join(' > '),
                      caminho: novoCaminho // Acoplado para o rastreador dos rankings
                  });
              });
          }
          if (item.filhos) { extrairTodosOsAlvos(item.filhos, novoCaminho); }
      });
  }

  function obterDataBrasiliaISO() { const d = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Sao_Paulo"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function obterDataBrasiliaBr() { return new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
  function obterHoraBrasilia() { const d = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Sao_Paulo"})); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  function obterSegundaFeiraDaSemana() {
    const d = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Sao_Paulo"}));
    const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
    const monday = new Date(d.setDate(diff));
    return `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
  }
  function sanitizarId(str) { return str.replace(/[.#$\[\]/]/g, "_"); }

  function getCorTermica(pct) {
    if (pct === 0) return 'transparent';
    if (pct <= 10) return 'rgb(220, 53, 69)';
    if (pct <= 40) { let p = (pct - 10) / 30; return `rgb(${Math.round(220 + (255 - 220) * p)}, ${Math.round(53 + (193 - 53) * p)}, ${Math.round(69 + (7 - 69) * p)})`; }
    if (pct <= 70) { let p = (pct - 40) / 30; return `rgb(${Math.round(255 - (255 - 40) * p)}, ${Math.round(193 - (193 - 167) * p)}, ${Math.round(7 + (69 - 7) * p)})`; }
    let p = (pct - 70) / 30; return `rgb(${Math.round(40 - (40 - 0) * p)}, ${Math.round(167 - (167 - 123) * p)}, ${Math.round(69 + (255 - 69) * p)})`;
  }

  const dataHojeISO = obterDataBrasiliaISO();
  const semanaAtualISO = obterSegundaFeiraDaSemana();

  function iniciarMonitoramentoDiario() {
      document.getElementById('data-display').innerText = `Data de Referência (Brasília): ${obterDataBrasiliaBr()}`;

      onValue(ref(db, `monitoramentoDiario/${dataHojeISO}`), (snapshot) => {
        const data = snapshot.val() || {};
        vistosGlobais = data.vistos ? Object.values(data.vistos) : [];
        anotacoesGlobais = data.anotacoes || {}; 
        atualizarUiComVistos();
      });

      onValue(ref(db, `estatisticas_semanal/${semanaAtualISO}`), (snapshot) => {
        const dataFirebase = snapshot.val() || {};
        let estatisticasCompletas = listaTodosAlvos.map(alvo => {
            return { titulo: alvo.titulo, count: dataFirebase[alvo.id] ? dataFirebase[alvo.id].count : 0, caminho: alvo.caminho };
        });
        estatisticasCompletas.sort((a, b) => b.count - a.count);
        const top15 = estatisticasCompletas.filter(s => s.count > 0).slice(0, 15);
        const bottom15 = estatisticasCompletas.slice(-15).reverse();
        
        // INTERCEPTADOR DE CLIQUE NOS RANKINGS (Injeção de data-caminho e onclick)
        document.getElementById('list-top').innerHTML = top15.length > 0 
            ? top15.map(s => `<li data-caminho="${s.caminho.join(' > ')}" onclick="window.focarAlvoFromStats(this)"><span>${s.titulo}</span> <span class="stat-count">${s.count} cliques</span></li>`).join('')
            : '<li style="color: #666; justify-content: center;">Nenhum alvo acessado ainda</li>';
            
        document.getElementById('list-bottom').innerHTML = bottom15.map(s => `<li data-caminho="${s.caminho.join(' > ')}" onclick="window.focarAlvoFromStats(this)"><span>${s.titulo}</span> <span class="stat-count">${s.count} cliques</span></li>`).join('');
      });

      onValue(ref(db, 'marcacoesTaticas/estrelas'), (snapshot) => {
          estrelasOrigem = snapshot.val() || [];
          atualizarEstrelasUI();
      });
  }

  // --- ARQUITETURA DE EXPANSÃO VIA RANKING ---
  window.focarAlvoFromStats = function(elemento) {
      const caminhoCompletoStr = elemento.getAttribute('data-caminho');
      if (!caminhoCompletoStr) return;
      const pastas = caminhoCompletoStr.split(' > ');

      // REGRA DE OURO: Desliga absolutamente todos os menus abertos antes
      document.querySelectorAll('.node').forEach(node => node.classList.remove('active'));

      // Abre sequencialmente de cima para baixo apenas as pastas necessárias
      let caminhoPassoAPasso = "";
      pastas.forEach((pasta, index) => {
          caminhoPassoAPasso += (index === 0 ? "" : " > ") + pasta;
          const nóAlvo = document.querySelector(`.node[data-path="${caminhoPassoAPasso}"]`);
          if (nóAlvo) nóAlvo.classList.add('active');
      });

      // Encontra a pasta final na tela e faz a rolagem suave até ela
      const nóFinal = document.querySelector(`.node[data-path="${caminhoCompletoStr}"]`);
      if (nóFinal) {
          nóFinal.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
  };

  window.clicarEstrela = function(e, idElemento) {
      e.preventDefault(); e.stopPropagation();
      if (estrelasOrigem.includes(idElemento)) {
          estrelasOrigem = estrelasOrigem.filter(orig => orig !== idElemento);
          set(ref(db, 'marcacoesTaticas/estrelas'), estrelasOrigem);
      } else {
          const isAmarela = estrelasOrigem.some(orig => idElemento.startsWith(orig + " > ") || orig.startsWith(idElemento + " > "));
          if (!isAmarela) {
              estrelasOrigem.push(idElemento);
              set(ref(db, 'marcacoesTaticas/estrelas'), estrelasOrigem);
          }
      }
  };

  function atualizarEstrelasUI() {
      document.querySelectorAll('.star-icon').forEach(el => {
          const id = el.getAttribute('data-star');
          el.classList.remove('star-orange', 'star-yellow');
          if (estrelasOrigem.includes(id)) { el.classList.add('star-orange'); } 
          else {
              const isAmarela = estrelasOrigem.some(orig => id.startsWith(orig + " > ") || orig.startsWith(id + " > "));
              if (isAmarela) el.classList.add('star-yellow');
          }
      });
  }

  window.abrirModalNota = function(e, idUnico, titulo) {
      e.preventDefault(); e.stopPropagation();
      alvoAtualNota = idUnico; tituloAtualNota = titulo;
      const safeKey = sanitizarId(idUnico);
      document.getElementById('nota-alvo-titulo').innerText = "Alerta: " + titulo;
      document.getElementById('nota-textarea').value = anotacoesGlobais[safeKey] ? anotacoesGlobais[safeKey].texto : "";
      document.getElementById('modal-overlay').style.display = 'block';
      document.getElementById('nota-modal').style.display = 'block';
      document.getElementById('nota-textarea').focus();
  };

  window.fecharModalNota = function() {
      document.getElementById('modal-overlay').style.display = 'none';
      document.getElementById('nota-modal').style.display = 'none';
  };

  window.salvarNotaFirebase = function() {
      const texto = document.getElementById('nota-textarea').value.trim();
      const safeKey = sanitizarId(alvoAtualNota);
      const notaRef = ref(db, `monitoramentoDiario/${dataHojeISO}/anotacoes/${safeKey}`);
      if (texto === "") { set(notaRef, null); } 
      else { set(notaRef, { texto: texto, operador: auth.currentUser ? auth.currentUser.email : 'Desconhecido', time: obterHoraBrasilia(), tituloOrigem: tituloAtualNota }); }
      window.fecharModalNota();
  };

  function atualizarUiComVistos() {
    document.querySelectorAll('.link-card').forEach(el => {
        el.classList.remove('visto'); const stamp = el.querySelector('.stamp'); if(stamp) stamp.remove();
    });

    vistosGlobais.forEach(v => {
      const el = document.querySelector(`.link-card[data-id="${v.id}"]`);
      if (el) { el.classList.add('visto'); let stamp = document.createElement('span'); stamp.className = 'stamp'; stamp.innerText = `[${v.time}]`; el.appendChild(stamp); }
    });

    document.querySelectorAll('.icon-nota').forEach(el => {
        const id = el.getAttribute('data-nota-id'); const safeKey = sanitizarId(id);
        if (anotacoesGlobais[safeKey]) { el.classList.add('tem-nota'); el.title = `Alerta: ${anotacoesGlobais[safeKey].texto}`; } 
        else { el.classList.remove('tem-nota'); el.title = "Adicionar Alerta"; }
    });

    document.querySelectorAll('.node').forEach(node => {
        const linksDentro = node.querySelectorAll('.link-card');
        if (linksDentro.length > 0 && !node.classList.contains('no-children')) {
            const vistosDentro = node.querySelectorAll('.link-card.visto');
            const pct = (vistosDentro.length / linksDentro.length) * 100;
            const fill = node.querySelector(':scope > button > .node-progress-bar > .node-progress-fill');
            if (fill) { fill.style.width = `${pct}%`; fill.style.backgroundColor = getCorTermica(pct); }
        }
    });

    const totalLinks = document.querySelectorAll('.link-card').length;
    const fill = document.getElementById('progress-fill'); const text = document.getElementById('progress-text');
    if (totalLinks === 0) return; 
    const porcentagem = Math.round((vistosGlobais.length / totalLinks) * 100);
    fill.style.width = `${porcentagem}%`;
    text.innerHTML = porcentagem >= 100 ? `<span style="color: var(--accent-green); font-weight: bold;">MONITORAMENTO GERAL CONCLUÍDO (100%) ✔️</span>` : `${vistosGlobais.length} / ${totalLinks} verificados (${porcentagem}%)`;
  }

  window.registrarVisualizacao = function(idUnico, tituloLink) {
    if (!vistosGlobais.some(v => v.id === idUnico)) {
      set(ref(db, `monitoramentoDiario/${dataHojeISO}/vistos`), [...vistosGlobais, { id: idUnico, time: obterHoraBrasilia(), operador: auth.currentUser ? auth.currentUser.email : 'Desconhecido' }]);
    }
    if (idUnico.startsWith("MOVIMENTOS")) {
        const safeKey = sanitizarId(idUnico); const statRef = ref(db, `estatisticas_semanal/${semanaAtualISO}/${safeKey}`);
        get(statRef).then(snap => { set(statRef, { titulo: tituloLink, count: (snap.exists() ? snap.val().count : 0) + 1 }); });
    }
  };

  window.baixarRelatorio = function() {
    get(ref(db, 'monitoramentoDiario')).then(snap => {
        if(!snap.exists()) return;
        const dados = snap.val(); let relatorio = "RELATÓRIO DE MONITORAMENTO E INTELIGÊNCIA - AESI BPCHOQUE\n\n";
        Object.keys(dados).sort().slice(-7).forEach(d => {
            relatorio += `[ DATA: ${d.split('-').reverse().join('/')} ]\n`;
            const vistos = (dados[d] && dados[d].vistos) ? Object.values(dados[d].vistos) : [];
            relatorio += `-> Total de fontes verificadas: ${vistos.length}\n`;
            vistos.forEach(v => { relatorio += ` - ${v.time} | ${v.id.split(' > ').slice(-2, -1)[0]}${v.operador ? ` | Op: ${v.operador}` : ''}\n`; });
            if (dados[d].anotacoes) {
                relatorio += `\n   *** ALERTAS TÁTICOS DO DIA ***\n`;
                Object.values(dados[d].anotacoes).forEach(n => { relatorio += `   [!] ${n.time} | ${n.tituloOrigem}: "${n.texto}" (Op: ${n.operador})\n`; });
            }
            relatorio += "\n------------------------------------------------\n\n";
        });
        const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([relatorio], {type: "text/plain;charset=utf-8"}));
        a.download = `Relatorio_Inteligencia_AESI_7_Dias.txt`; a.click();
    });
  }

  window.toggle = function(btn) { btn.parentElement.classList.toggle('active'); };
  window.mostrarTooltipPreview = function(item, btn) {
    if (btn.parentElement.classList.contains('active')) return;
    const tooltip = document.getElementById('tooltip-preview'); let htmlContent = '<ul class="tooltip-list">';
    if (item.filhos && item.filhos.length > 0) item.filhos.forEach(f => htmlContent += `<li>● ${f.nome}</li>`);
    else if (item.links && item.links.length > 0) item.links.forEach(l => htmlContent += `<li>🔗 Links Internos</li>`);
    tooltip.innerHTML = htmlContent + '</ul>'; const rect = btn.getBoundingClientRect();
    tooltip.style.left = (rect.right + 15) + 'px'; tooltip.style.top = rect.top + 'px'; tooltip.classList.add('show');
  };
  window.esconderTooltipPreview = function() { document.getElementById('tooltip-preview').classList.remove('show'); };
  window.recolherArvoreInteira = function() { document.querySelectorAll('.node').forEach(node => { const p = node.getAttribute('data-path'); if (p !== "MOVIMENTOS" && p !== "NOTÍCIAS") node.classList.remove('active'); }); };
  function normalizarTexto(t) { return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
  
  function vasculharArvore(lista, termo, caminhoAtual = [], resultados = []) {
    const termoFormatado = normalizarTexto(termo);
    lista.forEach(item => {
      const novoCaminho = [...caminhoAtual, item.nome];
      if (normalizarTexto(item.nome).includes(termoFormatado)) resultados.push({ item: item, caminho: novoCaminho });
      if (item.filhos && item.filhos.length > 0) vasculharArvore(item.filhos, termo, novoCaminho, resultados);
    });
    return resultados;
  }

  window.realizarBusca = function() {
    const input = document.getElementById('campoBusca').value; const caixa = document.getElementById('caixaResultados');
    if (input.length < 2) { caixa.style.display = 'none'; window.recolherArvoreInteira(); return; }
    caixa.innerHTML = '';
    vasculharArvore(window.DADOS_TOTAIS, input).forEach(res => {
        const div = document.createElement('div'); div.className = 'search-item';
        div.innerHTML = `<div class="search-item-title">${res.item.nome}</div><div class="search-item-path">${res.caminho.join(' > ')}</div>`;
        div.onclick = () => {
          window.recolherArvoreInteira(); let c = ""; 
          res.caminho.forEach((p, idx) => { c += (idx === 0 ? "" : " > ") + p; const node = document.querySelector(`.node[data-path="${c}"]`); if(node) node.classList.add('active'); });
          const target = document.querySelector(`.node[data-path="${res.caminho.join(' > ')}"]`);
          if(target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          caixa.style.display = 'none';
        };
        caixa.appendChild(div);
    });
    caixa.style.display = 'block';
  };

  function desenharArvore(listaDeDados, elementoPai, caminhoAtual = []) {
    listaDeDados.forEach(item => {
      const novoCaminho = [...caminhoAtual, item.nome]; const pathString = novoCaminho.join(' > ');
      const nodeDiv = document.createElement('div'); nodeDiv.className = 'node'; nodeDiv.setAttribute('data-path', pathString); 
      if (item.isRoot) nodeDiv.classList.add('active');
      const temFilhos = item.filhos && item.filhos.length > 0; const temLinks = item.links && item.links.length > 0;
      if (!temFilhos && !temLinks) nodeDiv.classList.add('no-children');
      const btn = document.createElement('button'); btn.onclick = function(e) { e.stopPropagation(); window.toggle(this); };
      
      if (temFilhos || temLinks) {
        btn.onmouseenter = function() { window.mostrarTooltipPreview(item, this); }; btn.onmouseleave = function() { window.esconderTooltipPreview(); };
        btn.innerHTML = `<div class="node-progress-bar"><div class="node-progress-fill"></div></div>`;
      }
      btn.innerHTML += `<div class="btn-left"><span class="star-icon" data-star="${pathString}" onclick="window.clicarEstrela(event, this.getAttribute('data-star'))">★</span><div class="icon-circle icon-${item.cor || 'white'}">${item.icone || '●'}</div><span>${item.nome}</span></div><span class="toggle-icon"></span>`;
      nodeDiv.appendChild(btn);

      if (temFilhos || temLinks) {
        const childrenDiv = document.createElement('div'); childrenDiv.className = 'children';
        if (temLinks) {
          item.links.forEach(link => {
            const linkNode = document.createElement('div'); linkNode.className = 'node no-children';
            const a = document.createElement('a'); const idUnico = pathString + " > " + link.url;
            a.href = link.url || '#'; a.target = '_blank'; a.className = 'link-card'; a.setAttribute('data-id', idUnico);
            a.onclick = () => window.registrarVisualizacao(idUnico, novoCaminho.slice(-2).join(' > '));
            
            a.innerHTML = `
              <span class="star-icon" data-star="${idUnico}" onclick="window.clicarEstrela(event, this.getAttribute('data-star'))">★</span>
              <div class="icon-circle icon-${link.tipo === 'link' ? 'link' : 'insta'}">${link.tipo === 'insta' ? '📸' : '🔗'}</div>
              <div class="link-text"><span>${link.tipo === 'insta' ? 'Instagram' : 'Website'}</span><span class="link-url">${link.textoUrl || ''}</span></div>
              <span class="icon-nota" data-nota-id="${idUnico}" onclick="window.abrirModalNota(event, '${idUnico}', '${novoCaminho.slice(-2).join(' > ')}')">💬</span>
            `;
            linkNode.appendChild(a); childrenDiv.appendChild(linkNode); 
          });
        }
        if (temFilhos) desenharArvore(item.filhos, childrenDiv, novoCaminho);
        nodeDiv.appendChild(childrenDiv);
      }
      elementoPai.appendChild(nodeDiv);
    });
  }
  document.addEventListener('click', (e) => { if (!e.target.closest('.search-box')) document.getElementById('caixaResultados').style.display = 'none'; });
</script>
</body>
</html>
