<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AESI BPCHOQUE - MONITORAMENTO DIÁRIO</title>

<style>
  :root {
    --bg-color: #000000;
    --card-bg: #0a0a0a;
    --border-color: #333333;
    --text-main: #ffffff;
    --accent-blue: #007bff;
    --accent-red: #dc3545;
    --accent-green: #28a745;
    --line-color: #555555;
  }

  body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px;
    overflow-x: auto; 
    overflow-y: auto;
  }

  /* =========================================
     NOVO: TELA PRETA COM TEXTO FALSO (MOBILE FRIENDLY)
     ========================================= */
  #tela-bloqueio {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #0d0d0d; /* Fundo quase preto, parece tela de erro de servidor */
    z-index: 9999999; 
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease; 
    user-select: none; /* Impede que a pessoa selecione o texto ao tentar clicar */
    -webkit-user-select: none;
  }

  #mensagem-falsa {
    color: #555555; /* Texto cinza escuro para não chamar atenção */
    font-size: 16px;
    font-family: monospace;
    letter-spacing: 1px;
  }

  /* O segredo da área de clique expandida para o celular */
  .alvo {
    position: relative;
    display: inline-block;
    cursor: default;
  }

  /* Cria um botão invisível de 30x30 pixels em cima da letra para não errar o toque */
  .alvo::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    background: transparent;
  }

  /* --- CABEÇALHO E TRACKING DIÁRIO --- */
  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 40px;
    margin-bottom: 10px;
  }

  .header-title {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
    display: flex;
    flex-direction: column;
  }

  .date-badge {
    font-size: 12px;
    color: #888;
    margin-top: 4px;
    font-weight: normal;
  }

  .connection-status {
    font-size: 10px;
    margin-top: 4px;
    color: var(--accent-blue);
  }

  /* --- BARRA DE PROGRESSO --- */
  .progress-wrapper {
    margin: 0 40px 30px 40px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 15px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 8px;
    font-weight: bold;
  }

  .progress-bar-bg {
    width: 100%;
    height: 10px;
    background: #222;
    border-radius: 5px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent-green);
    width: 0%;
    transition: width 0.5s ease;
    box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
  }

  /* --- BUSCA --- */
  .search-box {
    position: relative;
  }

  .search-input {
    background: #1a1a1a;
    color: white;
    border: 1px solid var(--border-color);
    padding: 10px 16px;
    border-radius: 20px;
    width: 250px;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
  }

  .search-input:focus {
    border-color: var(--accent-red);
    box-shadow: 0 0 8px rgba(220, 53, 69, 0.4);
  }

  .search-results {
    position: absolute;
    top: 45px;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    max-height: 400px;
    overflow-y: auto;
    display: none;
    box-shadow: 0 8px 16px rgba(0,0,0,0.8);
    z-index: 9999;
  }

  .search-item {
    padding: 12px;
    border-bottom: 1px solid var(--border-color);
    cursor: pointer;
    transition: 0.2s;
  }

  .search-item:last-child {
    border-bottom: none;
  }

  .search-item:hover {
    background: #1f1f1f;
    border-left: 3px solid var(--accent-red);
  }

  .search-item-title {
    font-weight: bold;
    font-size: 14px;
    color: var(--text-main);
  }

  .search-item-path {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
  }

  /* --- BALÃO FLUTUANTE DE PRÉVIA --- */
  #tooltip-preview {
    position: fixed;
    z-index: 10000;
    pointer-events: none;
    background: rgba(20, 20, 20, 0.85);
    backdrop-filter: blur(4px);
    border: 1px solid #444;
    border-radius: 8px;
    padding: 12px;
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, transform 0.2s ease;
    transform: translateX(-10px);
    max-height: 300px;
    overflow-y: hidden;
  }

  #tooltip-preview.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
  }

  .tooltip-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    color: rgba(255, 255, 255, 0.4);
    border-bottom: 1px solid #444;
    padding-bottom: 4px;
  }

  .tooltip-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .tooltip-list li {
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .tooltip-list li:last-child {
    margin-bottom: 0;
  }

  /* --- CSS DA ÁRVORE --- */
  .tree-container {
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    padding: 0 40px 40px 40px;
    min-width: max-content;
  }

  .node {
    display: flex;
    flex-direction: row;
    align-items: center;
  }

  .children {
    display: none; 
    flex-direction: column;
    justify-content: center;
    padding-left: 50px;
    position: relative;
  }

  .node.active > .children {
    display: flex;
  }

  button { position: relative; }

  .node.active > button::after {
    content: '';
    position: absolute;
    right: -50px;
    top: 50%;
    width: 50px;
    height: 1px;
    background: var(--line-color);
    z-index: 0;
  }

  .children > .node {
    position: relative;
    padding: 8px 0; 
  }

  .children > .node::before {
    content: '';
    position: absolute;
    left: -50px;
    top: 50%;
    width: 50px;
    height: 1px;
    background: var(--line-color);
  }

  .children > .node::after {
    content: '';
    position: absolute;
    left: -50px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--line-color);
  }

  .children > .node:first-child::after { top: 50%; }
  .children > .node:last-child::after { bottom: 50%; }
  .children > .node:first-child:last-child::after { display: none; }

  .node > button {
    background: var(--card-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 8px 16px 8px 8px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    min-width: 220px;
    justify-content: space-between;
    white-space: nowrap;
    z-index: 1;
  }

  .node > button:hover {
    background: #1a1a1a;
    border-color: #666;
  }

  .node.active > button {
    border-color: #888;
  }

  .btn-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-circle {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    flex-shrink: 0;
  }

  .icon-white { background: #fff; color: #000; }
  .icon-blue { background: var(--accent-blue); color: #fff; }
  .icon-red { background: var(--accent-red); color: #fff; }
  .icon-insta { background: #E1306C; color: #fff; }
  .icon-face { background: #1877F2; color: #fff; }

  .toggle-icon {
    font-size: 16px;
    color: #888;
    margin-left: 10px;
  }
  .node > button .toggle-icon::before { content: '⊕'; }
  .node.active > button .toggle-icon::before { content: '⊖'; }

  /* --- LINKS E ESTILO DE "VISTO" --- */
  .link-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 30px 8px 8px; 
    text-decoration: none;
    color: var(--text-main);
    font-size: 14px;
    min-width: 240px;
    transition: 0.2s;
    white-space: nowrap;
    z-index: 1;
    position: relative;
  }

  .link-card:hover {
    background: #151515;
    border-color: #888;
  }

  .link-card.visto {
    border-color: var(--accent-green) !important;
    background: rgba(40, 167, 69, 0.05) !important;
  }

  .link-card.visto::after {
    content: '✔';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent-green);
    font-size: 16px;
    font-weight: bold;
  }

  .link-text {
    display: flex;
    flex-direction: column;
  }

  .link-url {
    font-size: 10px;
    color: #888;
    margin-top: 2px;
  }

  .no-children .toggle-icon {
    display: none;
  }
</style>
</head>

<script>
  let siteDesbloqueado = false;
  let travadoPermanente = false;
  let sequenciaToques = [];

  // Ouve qualquer clique na tela de bloqueio
  document.getElementById('tela-bloqueio').addEventListener('click', function(event) {
    if (siteDesbloqueado || travadoPermanente) return;

    // Se o lugar tocado for uma das nossas letras "alvo"
    if (event.target.classList.contains('alvo')) {
      sequenciaToques.push(event.target.getAttribute('data-chave'));
    } else {
      // Se tocou em qualquer outro lugar (fundo preto ou no meio do texto)
      sequenciaToques.push('erro');
    }

    // Só permite 2 toques no total
    if (sequenciaToques.length === 2) {
      // Regra de segurança: O primeiro toque tem que ser na "ultima", o segundo na "primeira"
      if (sequenciaToques[0] === 'ultima' && sequenciaToques[1] === 'primeira') {
        siteDesbloqueado = true;
        this.style.opacity = '0'; // Dissolve a tela preta
        setTimeout(() => {
          this.style.display = 'none'; // Some de vez da frente do site
        }, 800);
      } else {
        // Errou! Trava o sistema silenciosamente.
        travadoPermanente = true;
        
        // Remove a "área de clique" das letras para que fiquem inúteis.
        document.querySelectorAll('.alvo').forEach(el => {
          el.classList.remove('alvo');
        });
      }
    }
  });
</script>

  function obterDataBrasilia() {
    const opçoes = { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' };
    return new Intl.DateTimeFormat('pt-BR', opçoes).format(new Date());
  }

  onValue(monitoramentoRef, (snapshot) => {
    document.getElementById('connection-status').innerText = "Conectado em tempo real 🟢";
    
    const data = snapshot.val();
    const hoje = obterDataBrasilia();
    document.getElementById('data-display').innerText = `Data de Referência (Brasília): ${hoje}`;

    if (!data || data.data_referencia !== hoje) {
      set(monitoramentoRef, {
        data_referencia: hoje,
        vistos: []
      });
    } else {
      vistosGlobais = data.vistos || [];
      atualizarUiComVistos();

  function atualizarUiComVistos() {
    document.querySelectorAll('.link-card').forEach(el => el.classList.remove('visto'));

      const el = document.querySelector(`.link-card[data-id="${idUnico}"]`);

      text.style.color = 'inherit';

  window.toggle = function(buttonElement) {
    const currentNode = buttonElement.parentElement;
    currentNode.classList.toggle('active');
    document.getElementById('tooltip-preview').classList.remove('show');
    if (currentNode.classList.contains('active')) {
      setTimeout(() => currentNode.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }), 150);
    }
  };

  window.mostrarTooltipPreview = function(item, buttonElement) {
    const nodePai = buttonElement.parentElement;
    if (nodePai.classList.contains('active')) return;

    const tooltip = document.getElementById('tooltip-preview');
    let htmlContent = '<div class="tooltip-title">Prévia de Ramificações</div><ul class="tooltip-list">';
    
    if (item.filhos && item.filhos.length > 0) {
      item.filhos.forEach(filho => htmlContent += `<li><span style="color: var(--accent-${filho.cor || 'white'});">●</span> ${filho.nome}</li>`);
    } else if (item.links && item.links.length > 0) {
      item.links.forEach(link => htmlContent += `<li>🔗 ${link.tipo === 'insta' ? 'Instagram' : 'Link'}</li>`);
    }
    htmlContent += '</ul>';
    tooltip.innerHTML = htmlContent;

    const rect = buttonElement.getBoundingClientRect();
    tooltip.style.left = (rect.right + 15) + 'px';
    tooltip.style.top = rect.top + 'px';
    tooltip.classList.add('show');
  };

  window.esconderTooltipPreview = function() {
    document.getElementById('tooltip-preview').classList.remove('show');
  };

  window.recolherArvoreInteira = function() {
    const allNodes = document.querySelectorAll('.node');
    allNodes.forEach(node => {
        if (node.getAttribute('data-path') !== "MOVIMENTOS") {
            node.classList.remove('active');
        }
    });
  };

  window.recolherBusca = function() {
      const input = document.getElementById('campoBusca').value;
      if (input.length > 0) window.recolherArvoreInteira();
  };

  window.abrirCaminhoMagico = function(caminhoArray) {
    window.recolherArvoreInteira(); 
    document.querySelector('.node[data-path="MOVIMENTOS"]').classList.add('active');
    let caminhoMontado = "MOVIMENTOS"; 
    caminhoArray.forEach(nomeDoNo => {
      caminhoMontado += " > " + nomeDoNo;
      const noParaAbrir = document.querySelector(`.node[data-path="${caminhoMontado}"]`);
      if (noParaAbrir) noParaAbrir.classList.add('active');
    });
  };

  function normalizarTexto(texto) {
    return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  function vasculharArvore(lista, termo, caminhoAtual = [], resultados = []) {
    const termoFormatado = normalizarTexto(termo);
    lista.forEach(item => {
      const nomeFormatado = normalizarTexto(item.nome);
      const novoCaminho = [...caminhoAtual, item.nome];

      if (nomeFormatado.includes(termoFormatado)) {
        resultados.push({ item: item, caminho: novoCaminho });
      }
      if (item.filhos && item.filhos.length > 0) {
        vasculharArvore(item.filhos, termo, novoCaminho, resultados);
      }
    });
    return resultados;
  }

  window.realizarBusca = function() {
    const input = document.getElementById('campoBusca').value;
    const caixaResultados = document.getElementById('caixaResultados');

    if (input.length < 2) {
      caixaResultados.style.display = 'none';
      window.recolherArvoreInteira();
      return;
    }

    const matches = vasculharArvore(MEUS_MOVIMENTOS, input);
    caixaResultados.innerHTML = '';

    if (matches.length === 0) {
      caixaResultados.innerHTML = '<div class="search-item">Nenhum resultado encontrado</div>';
    } else {
      matches.forEach(res => {
        const div = document.createElement('div');
        div.className = 'search-item';
        div.innerHTML = `<div class="search-item-title">${res.item.nome}</div><div class="search-item-path">${res.caminho.join(' > ')}</div>`;
        
        div.onmouseenter = () => window.abrirCaminhoMagico(res.caminho);
        
        div.onclick = () => {
          if (res.item.links && res.item.links.length > 0) {
            const idBase = "MOVIMENTOS > " + res.caminho.join(' > ') + " > " + res.item.links[0].url;
            window.registrarVisualizacao(idBase);
            window.open(res.item.links[0].url, '_blank');
          } else {
            const targetNode = document.querySelector(`.node[data-path="MOVIMENTOS > ${res.caminho.join(' > ')}"]`);
            if(targetNode) targetNode.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
          }
        };
        caixaResultados.appendChild(div);
      });
    }
    caixaResultados.style.display = 'block';
  };

  function desenharArvore(listaDeDados, elementoPai, caminhoAtual = []) {
    listaDeDados.forEach(item => {
      const novoCaminho = [...caminhoAtual, item.nome];
      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'node';
      nodeDiv.setAttribute('data-path', "MOVIMENTOS > " + novoCaminho.join(' > ')); 

      const temFilhos = item.filhos && item.filhos.length > 0;
      const temLinks = item.links && item.links.length > 0;

      if (!temFilhos && !temLinks) nodeDiv.classList.add('no-children');

      const btn = document.createElement('button');
      btn.onclick = function(e) { e.stopPropagation(); window.toggle(this); };

      if (temFilhos || temLinks) {
        btn.onmouseenter = function() { window.mostrarTooltipPreview(item, this); };
        btn.onmouseleave = function() { window.esconderTooltipPreview(); };
      }

      const btnLeft = document.createElement('div');
      btnLeft.className = 'btn-left';

      const iconDiv = document.createElement('div');
      iconDiv.className = 'icon-circle icon-' + (item.cor || 'white');
      iconDiv.textContent = item.icone || '●';

      const spanText = document.createElement('span');
      spanText.textContent = item.nome;

      btnLeft.appendChild(iconDiv);
      btnLeft.appendChild(spanText);
      btn.appendChild(btnLeft);

      const toggleIcon = document.createElement('span');
      toggleIcon.className = 'toggle-icon';
      btn.appendChild(toggleIcon);

      nodeDiv.appendChild(btn);

      if (temFilhos || temLinks) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'children';

        if (temLinks) {
          item.links.forEach(link => {
            const linkNode = document.createElement('div');
            linkNode.className = 'node no-children';

            const a = document.createElement('a');
            a.href = link.url || '#';
            a.target = '_blank';
            a.className = 'link-card';

            const idUnicoLink = "MOVIMENTOS > " + novoCaminho.join(' > ') + " > " + link.url;
            a.setAttribute('data-id', idUnicoLink);

            a.onclick = () => window.registrarVisualizacao(idUnicoLink);

            const linkIcon = document.createElement('div');
            linkIcon.className = 'icon-circle icon-' + link.tipo;
            linkIcon.textContent = link.tipo === 'insta' ? '📸' : (link.tipo === 'face' ? 'f' : '🔗');

            const textDiv = document.createElement('div');
            textDiv.className = 'link-text';
            const spanNome = document.createElement('span');
            spanNome.textContent = link.tipo === 'insta' ? 'Instagram' : (link.tipo === 'face' ? 'Facebook' : 'Link');
            textDiv.appendChild(spanNome);

            if (link.textoUrl) {
              const spanUrl = document.createElement('span');
              spanUrl.className = 'link-url';
              spanUrl.textContent = link.textoUrl;
              textDiv.appendChild(spanUrl);
            }

            a.appendChild(linkIcon);
            a.appendChild(textDiv);
            linkNode.appendChild(a);
            childrenDiv.appendChild(linkNode);
          });
        }

        if (temFilhos) desenharArvore(item.filhos, childrenDiv, novoCaminho);
        nodeDiv.appendChild(childrenDiv);
      }
      elementoPai.appendChild(nodeDiv);
    });
  }

  const raiz = document.getElementById('raiz-arvore');
  desenharArvore(MEUS_MOVIMENTOS, raiz, []);
  
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-box')) document.getElementById('caixaResultados').style.display = 'none';
  });

</script>
