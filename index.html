<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AESI BPCHOQUE - ACESSO RESTRITO</title>
<link rel="icon" href="bpchq_colorido_p_0.png" type="image/png">

<style>
  :root {
    --bg-color: #000000;
    --card-bg: #0a0a0a;
    --border-color: #333333;
    --text-main: #ffffff;
    --accent-blue: #007bff;
    --accent-red: #dc3545;
    --accent-yellow: #ffc107;
    --accent-orange: #ff8c00;
    --accent-green: #28a745;
    --line-color: #555555;
    --neon-alert: #ff0055;
  }

  body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: hidden; 
  }

  /* =========================================
     TELA DE LOGIN
     ========================================= */
  #login-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: var(--bg-color);
  }

  .login-box {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 12px;
    border: 1px solid #222;
    text-align: center;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .login-box img { width: 120px; margin-bottom: 30px; }

  .login-box input {
    width: 100%; padding: 12px; margin-bottom: 15px; background: #111;
    border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none;
  }
  .login-box input:focus { border-color: var(--accent-red); }

  .login-box button {
    width: 100%; padding: 12px; background: var(--accent-red); color: white;
    border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; letter-spacing: 1px;
  }
  .login-box button:hover { background: #b02a37; }

  /* =========================================
     PAINEL PRINCIPAL
     ========================================= */
  #app-content { display: none; padding: 20px; }

  .header-container { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px; margin-bottom: 10px; }
  .header-title { font-size: 24px; font-weight: bold; letter-spacing: 1px; display: flex; flex-direction: column; }
  .date-badge { font-size: 12px; color: #888; margin-top: 4px; font-weight: normal; }
  .connection-status { font-size: 10px; margin-top: 4px; color: var(--accent-blue); }

  .progress-wrapper { margin: 0 40px 30px 40px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .progress-info { display: flex; flex-direction: column; font-size: 14px; font-weight: bold; gap: 4px; }
  
  .action-buttons { display: flex; gap: 10px; }
  .btn-action { background: #1a1a1a; color: white; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; }
  .btn-action:hover { background: #333; border-color: #666; }
  .btn-logout { border-color: var(--accent-red); color: var(--accent-red); }
  .btn-logout:hover { background: var(--accent-red); color: white; }

  .progress-bar-bg { width: 100%; height: 10px; background: #222; border-radius: 5px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent-green); width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(40, 167, 69, 0.5); }

  .search-box { position: relative; }
  .search-input { background: #1a1a1a; color: white; border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 20px; width: 250px; font-size: 14px; outline: none; transition: 0.2s; }
  .search-input:focus { border-color: var(--accent-red); box-shadow: 0 0 8px rgba(220, 53, 69, 0.4); }
  .search-results { position: absolute; top: 45px; left: 0; right: 0; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; max-height: 400px; overflow-y: auto; display: none; box-shadow: 0 8px 16px rgba(0,0,0,0.8); z-index: 9999; }
  .search-item { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover { background: #1f1f1f; border-left: 3px solid var(--accent-red); }
  .search-item-title { font-weight: bold; font-size: 14px; color: var(--text-main); }
  .search-item-path { font-size: 11px; color: #888; margin-top: 4px; }

  /* =========================================
     ESTRUTURA DE DIVISÃO DO WORKSPACE
     ========================================= */
  .workspace-wrapper { display: flex; gap: 25px; padding: 0 40px 40px 40px; align-items: flex-start; }
  .left-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; overflow-x: auto; }
  .right-panel { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }

  .stats-container { display: flex; gap: 20px; margin: 0; width: 100%; }
  .stat-box { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin: 0; }
  .stat-box h4 { margin: 0 0 15px 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
  
  .stat-list { list-style: none; padding: 0; margin: 0; }
  .stat-list li { 
    font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; 
    align-items: center; background: #111; padding: 8px; border-radius: 4px; border-left: 2px solid #444; 
    cursor: pointer; transition: all 0.2s ease; user-select: none;
  }
  .stat-list li:hover { background: #1c1c1c; border-left-width: 4px; }
  .stat-list.top li { border-left-color: var(--accent-red); }
  .stat-list.bottom li { border-left-color: var(--accent-blue); }
  .stat-count { font-weight: bold; color: #888; font-size: 11px; background: #222; padding: 2px 6px; border-radius: 10px; }

  /* --- VISOR FLUTUANTE DE PREVIA (TOOLTIP) --- */
  #tooltip-preview { 
    position: fixed; z-index: 10000; pointer-events: auto; background: rgba(10, 10, 10, 0.98); 
    backdrop-filter: blur(6px); border: 1px solid #444; border-radius: 8px; padding: 14px; 
    color: rgba(255, 255, 255, 0.8); font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
    opacity: 0; visibility: hidden; transition: opacity 0.15s ease, transform 0.15s ease; 
    max-width: 320px; word-wrap: break-word;
  }
  #tooltip-preview.show { opacity: 1; visibility: visible; }
  .tooltip-title { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: rgba(255, 255, 255, 0.4); border-bottom: 1px solid #333; padding-bottom: 4px; }

  #tooltip-preview a, #calendar-event-list a { color: #00a2ff !important; text-decoration: underline !important; font-weight: bold; }

  /* --- SISTEMA DE ESTRELAS --- */
  .star-icon {
    font-size: 20px; color: transparent; -webkit-text-stroke: 1.5px #666; cursor: pointer; transition: all 0.2s ease;
    user-select: none; display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; z-index: 10;
  }
  .star-icon:hover { -webkit-text-stroke: 1.5px #aaa; }
  .star-icon.star-yellow { color: var(--accent-yellow); -webkit-text-stroke: 0; filter: drop-shadow(0 0 4px rgba(255, 193, 7, 0.4)); }
  .star-icon.star-orange { color: var(--accent-orange); -webkit-text-stroke: 0; filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.8)); transform: scale(1.15); }

  /* --- DESIGN DOS ÍCONES PUROS DA ARVORE --- */
  .icon-nota {
    font-size: 13px; cursor: pointer; margin-left: 6px; color: #888; background: #161616; 
    border: 1px solid #444; width: 25px; height: 25px; border-radius: 4px; transition: all 0.2s ease; 
    z-index: 15; display: inline-flex; align-items: center; justify-content: center; user-select: none; box-sizing: border-box;
  }
  .icon-nota:hover { background: #252525; border-color: #666; color: #fff; }
  
  .icon-nota.tem-nota {
    background: var(--neon-alert) !important; border-color: var(--neon-alert) !important; color: #ffffff !important;
    box-shadow: 0 0 10px var(--neon-alert), 0 0 20px var(--neon-alert);
    animation: pulsarAlertaTatico 0.8s infinite alternate ease-in-out;
  }
  @keyframes pulsarAlertaTatico {
    0% { transform: scale(1); box-shadow: 0 0 6px var(--neon-alert); }
    100% { transform: scale(1.1); box-shadow: 0 0 15px var(--neon-alert); }
  }

  /* =========================================
     MODAL AMPLIADO (LEITURA COMPLETA)
     ========================================= */
  #modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 19999; backdrop-filter: blur(2px); }
  #nota-modal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--card-bg); border: 1px solid var(--accent-yellow); border-radius: 8px;
    padding: 25px; z-index: 20000; width: 560px; max-width: 92%; box-shadow: 0 15px 40px rgba(0,0,0,0.9);
  }
  #nota-modal h4 { margin: 0 0 15px 0; color: var(--accent-yellow); font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 10px; }
  
  #nota-textarea { 
    width: 100%; height: 200px; background: #111; color: #fff; border: 1px solid #333; 
    padding: 12px; border-radius: 6px; resize: vertical; outline: none; margin-bottom: 15px; 
    box-sizing: border-box; font-family: inherit; font-size: 14px; line-height: 1.5; 
  }
  #nota-textarea:focus, #nota-local:focus, #nota-movimento-input:focus { border-color: var(--accent-yellow); }
  
  #nota-local {
    width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 10px;
    border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; outline: none; font-size: 13px;
  }
  .input-linha-dupla { display: flex; gap: 12px; margin-bottom: 15px; }
  .input-linha-dupla div { flex: 1; }
  .input-linha-dupla label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; }
  .input-linha-dupla input { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 6px; box-sizing: border-box; outline: none; font-size: 13px; color-scheme: dark; }

  .nota-actions { display: flex; justify-content: space-between; border-top: 1px solid #222; padding-top: 15px; margin-top: 5px; }
  .btn-salvar-nota { background: var(--accent-yellow); color: #000; border: none; padding: 10px 22px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 13px; }
  .btn-fechar-nota { background: transparent; color: #888; border: 1px solid #555; padding: 10px 22px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 13px; }
  .btn-salvar-nota:hover { background: #e0a800; }
  .btn-fechar-nota:hover { background: #333; color: #fff; }

  /* --- CSS DA ÁRVORE --- */
  .tree-container { display: flex; flex-direction: column; gap: 20px; justify-content: flex-start; align-items: flex-start; padding: 0; width: 100%; }
  .node { display: flex; flex-direction: row; align-items: center; }
  .children { display: none; flex-direction: column; justify-content: center; padding-left: 50px; position: relative; }
  .node.active > .children { display: flex; }
  
  .node > button {
    position: relative; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);
    padding: 8px 16px 14px 8px; cursor: pointer; border-radius: 8px; font-size: 14px;
    transition: all 0.3s ease; display: inline-flex; align-items: center; min-width: 240px; justify-content: space-between; white-space: nowrap; z-index: 1;
  }
  .node > button:hover { background: #1a1a1a; border-color: #666; }
  .node.active > button { border-color: #888; }
  .node.active > button::after { content: ''; position: absolute; right: -50px; top: 50%; width: 50px; height: 1px; background: var(--line-color); z-index: 0; }
  .children > .node { position: relative; padding: 8px 0; }
  .children > .node::before { content: ''; position: absolute; left: -50px; top: 50%; width: 50px; height: 1px; background: var(--line-color); }
  .children > .node::after { content: ''; position: absolute; left: -50px; top: 0; bottom: 0; width: 1px; background: var(--line-color); }
  .children > .node:first-child::after { top: 50%; }
  .children > .node:last-child::after { bottom: 50%; }
  .children > .node:first-child:last-child::after { display: none; }

  .node-progress-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 0 0 8px 8px; overflow: hidden; }
  .node-progress-fill { height: 100%; width: 0%; background-color: transparent; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.6s ease; }

  .btn-left { display: flex; align-items: center; gap: 8px; }
  .icon-circle { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; transition: 0.3s; }
  .icon-white { background: #fff; color: #000; }
  .icon-blue { background: var(--accent-blue); color: #fff; }
  .icon-red { background: var(--accent-red); color: #fff; }
  .icon-insta { background: #E1306C; color: #fff; }
  .icon-face { background: #1877F2; color: #fff; }
  .icon-link { background: #555; color: #fff; } 
  .toggle-icon { font-size: 16px; color: #888; margin-left: 10px; }
  .node > button .toggle-icon::before { content: '⊕'; }
  .node.active > button .toggle-icon::before { content: '⊖'; }

  .link-card {
    display: flex; align-items: center; gap: 8px; background: var(--card-bg);
    border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 65px 8px 8px; 
    text-decoration: none; color: var(--text-main); font-size: 14px; min-width: 240px;
    transition: 0.2s; white-space: nowrap; z-index: 1; position: relative;
  }
  .link-card:hover { background: #151515; border-color: #888; }
  .link-card.visto { border-color: var(--accent-green) !important; background: rgba(40, 167, 69, 0.05) !important; }
  .link-card.visto::after { content: '✔'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--accent-green); font-size: 14px; font-weight: bold; }

  .stamp { position: absolute; right: 32px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--accent-green); font-family: monospace; letter-spacing: 0.5px; }
  .link-text { display: flex; flex-direction: column; }
  .link-url { font-size: 10px; color: #888; margin-top: 2px; }
  .no-children .toggle-icon { display: none; }
