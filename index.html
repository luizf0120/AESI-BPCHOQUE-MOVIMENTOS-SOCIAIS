<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AESI BPCHOQUE - ACESSO RESTRITO</title>
<link rel="icon" href="bpchq_colorido_p_0.png" type="image/png">

<style>
  :root {
    --bg-color: #000000;
    --card-bg: #0a0a0a;
    --border-color: #333333;
    --text-main: #ffffff;
    --accent-blue: #007bff;
    --accent-red: #dc3545;
    --accent-yellow: #ffc107;
    --accent-orange: #ff8c00;
    --accent-green: #28a745;
    --line-color: #555555;
    --neon-alert: #ff0055;
  }

  body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: hidden; 
  }

  /* =========================================
     TELA DE LOGIN
     ========================================= */
  #login-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: var(--bg-color);
  }

  .login-box {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 12px;
    border: 1px solid #222;
    text-align: center;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .login-box img { width: 120px; margin-bottom: 30px; }

  .login-box input {
    width: 100%; padding: 12px; margin-bottom: 15px; background: #111;
    border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none;
  }
  .login-box input:focus { border-color: var(--accent-red); }

  .login-box button {
    width: 100%; padding: 12px; background: var(--accent-red); color: white;
    border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; letter-spacing: 1px;
  }
  .login-box button:hover { background: #b02a37; }

  /* =========================================
     PAINEL PRINCIPAL
     ========================================= */
  #app-content { display: none; padding: 20px; }

  .header-container { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px; margin-bottom: 10px; }
  .header-title { font-size: 24px; font-weight: bold; letter-spacing: 1px; display: flex; flex-direction: column; }
  .date-badge { font-size: 12px; color: #888; margin-top: 4px; font-weight: normal; }
  .connection-status { font-size: 10px; margin-top: 4px; color: var(--accent-blue); }

  .progress-wrapper { margin: 0 40px 30px 40px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .progress-info { display: flex; flex-direction: column; font-size: 14px; font-weight: bold; gap: 4px; }
  
  .action-buttons { display: flex; gap: 10px; }
  .btn-action { background: #1a1a1a; color: white; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; }
  .btn-action:hover { background: #333; border-color: #666; }
  .btn-logout { border-color: var(--accent-red); color: var(--accent-red); }
  .btn-logout:hover { background: var(--accent-red); color: white; }

  .progress-bar-bg { width: 100%; height: 10px; background: #222; border-radius: 5px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent-green); width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(40, 167, 69, 0.5); }

  .search-box { position: relative; }
  .search-input { background: #1a1a1a; color: white; border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 20px; width: 250px; font-size: 14px; outline: none; transition: 0.2s; }
  .search-input:focus { border-color: var(--accent-red); box-shadow: 0 0 8px rgba(220, 53, 69, 0.4); }
  .search-results { position: absolute; top: 45px; left: 0; right: 0; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; max-height: 400px; overflow-y: auto; display: none; box-shadow: 0 8px 16px rgba(0,0,0,0.8); z-index: 9999; }
  .search-item { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover { background: #1f1f1f; border-left: 3px solid var(--accent-red); }
  .search-item-title { font-weight: bold; font-size: 14px; color: var(--text-main); }
  .search-item-path { font-size: 11px; color: #888; margin-top: 4px; }

  /* =========================================
     ESTRUTURA DE DIVISÃO DO WORKSPACE
     ========================================= */
  .workspace-wrapper { display: flex; gap: 25px; padding: 0 40px 40px 40px; align-items: flex-start; }
  .left-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; overflow-x: auto; }
  .right-panel { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }

  .stats-container { display: flex; gap: 20px; margin: 0; width: 100%; }
  .stat-box { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin: 0; }
  .stat-box h4 { margin: 0 0 15px 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
  
  .stat-list { list-style: none; padding: 0; margin: 0; }
  .stat-list li { 
    font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; 
    align-items: center; background: #111; padding: 8px; border-radius: 4px; border-left: 2px solid #444; 
    cursor: pointer; transition: all 0.2s ease; user-select: none;
  }
  .stat-list li:hover { background: #1c1c1c; border-left-width: 4px; }
  .stat-list.top li { border-left-color: var(--accent-red); }
  .stat-list.bottom li { border-left-color: var(--accent-blue); }
  .stat-count { font-weight: bold; color: #888; font-size: 11px; background: #222; padding: 2px 6px; border-radius: 10px; }

  /* --- VISOR FLUTUANTE DE PREVIA (TOOLTIP) --- */
  #tooltip-preview { 
    position: fixed; z-index: 10000; pointer-events: auto; background: rgba(10, 10, 10, 0.98); 
    backdrop-filter: blur(6px); border: 1px solid #444; border-radius: 8px; padding: 14px; 
    color: rgba(255, 255, 255, 0.8); font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
    opacity: 0; visibility: hidden; transition: opacity 0.15s ease, transform 0.15s ease; 
    max-width: 320px; word-wrap: break-word;
  }
  #tooltip-preview.show { opacity: 1; visibility: visible; }
  .tooltip-title { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: rgba(255, 255, 255, 0.4); border-bottom: 1px solid #333; padding-bottom: 4px; }

  #tooltip-preview a, #calendar-event-list a { color: #00a2ff !important; text-decoration: underline !important; font-weight: bold; }

  /* --- SISTEMA DE ESTRELAS --- */
  .star-icon {
    font-size: 20px; color: transparent; -webkit-text-stroke: 1.5px #666; cursor: pointer; transition: all 0.2s ease;
    user-select: none; display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; z-index: 10;
  }
  .star-icon:hover { -webkit-text-stroke: 1.5px #aaa; }
  .star-icon.star-yellow { color: var(--accent-yellow); -webkit-text-stroke: 0; filter: drop-shadow(0 0 4px rgba(255, 193, 7, 0.4)); }
  .star-icon.star-orange { color: var(--accent-orange); -webkit-text-stroke: 0; filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.8)); transform: scale(1.15); }

  /* --- DESIGN DOS ÍCONES PUROS DA ARVORE --- */
  .icon-nota {
    font-size: 13px; cursor: pointer; margin-left: 6px; color: #888; background: #161616; 
    border: 1px solid #444; width: 25px; height: 25px; border-radius: 4px; transition: all 0.2s ease; 
    z-index: 15; display: inline-flex; align-items: center; justify-content: center; user-select: none; box-sizing: border-box;
  }
  .icon-nota:hover { background: #252525; border-color: #666; color: #fff; }
  
  .icon-nota.tem-nota {
    background: var(--neon-alert) !important; border-color: var(--neon-alert) !important; color: #ffffff !important;
    box-shadow: 0 0 10px var(--neon-alert), 0 0 20px var(--neon-alert);
    animation: pulsarAlertaTatico 0.8s infinite alternate ease-in-out;
  }
  @keyframes pulsarAlertaTatico {
    0% { transform: scale(1); box-shadow: 0 0 6px var(--neon-alert); }
    100% { transform: scale(1.1); box-shadow: 0 0 15px var(--neon-alert); }
  }

  /* =========================================
     MODAL AMPLIADO (LEITURA COMPLETA)
     ========================================= */
  #modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 19999; backdrop-filter: blur(2px); }
  #nota-modal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--card-bg); border: 1px solid var(--accent-yellow); border-radius: 8px;
    padding: 25px; z-index: 20000; width: 560px; max-width: 92%; box-shadow: 0 15px 40px rgba(0,0,0,0.9);
  }
  #nota-modal h4 { margin: 0 0 15px 0; color: var(--accent-yellow); font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 10px; }
  
  #nota-textarea { 
    width: 100%; height: 200px; background: #111; color: #fff; border: 1px solid #333; 
    padding: 12px; border-radius: 6px; resize: vertical; outline: none; margin-bottom: 15px; 
    box-sizing: border-box; font-family: inherit; font-size: 14px; line-height: 1.5; 
  }
  #nota-textarea:focus, #nota-local:focus, #nota-movimento-input:focus { border-color: var(--accent-yellow); }
  
  #nota-local {
    width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 10px;
    border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; outline: none; font-size: 13px;
  }
  .input-linha-dupla { display: flex; gap: 12px; margin-bottom: 15px; }
  .input-linha-dupla div { flex: 1; }
  .input-linha-dupla label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; }
  .input-linha-dupla input { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 6px; box-sizing: border-box; outline: none; font-size: 13px; color-scheme: dark; }

  .nota-actions { display: flex; justify-content: space-between; border-top: 1px solid #222; padding-top: 15px; margin-top: 5px; }
  .btn-salvar-nota { background: var(--accent-yellow); color: #000; border: none; padding: 10px 22px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 13px; }
  .btn-fechar-nota { background: transparent; color: #888; border: 1px solid #555; padding: 10px 22px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 13px; }
  .btn-salvar-nota:hover { background: #e0a800; }
  .btn-fechar-nota:hover { background: #333; color: #fff; }

  /* --- CSS DA ÁRVORE --- */
  .tree-container { display: flex; flex-direction: column; gap: 20px; justify-content: flex-start; align-items: flex-start; padding: 0; width: 100%; }
  .node { display: flex; flex-direction: row; align-items: center; }
  .children { display: none; flex-direction: column; justify-content: center; padding-left: 50px; position: relative; }
  .node.active > .children { display: flex; }
  
  .node > button {
    position: relative; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);
    padding: 8px 16px 14px 8px; cursor: pointer; border-radius: 8px; font-size: 14px;
    transition: all 0.3s ease; display: inline-flex; align-items: center; min-width: 240px; justify-content: space-between; white-space: nowrap; z-index: 1;
  }
  .node > button:hover { background: #1a1a1a; border-color: #666; }
  .node.active > button { border-color: #888; }
  .node.active > button::after { content: ''; position: absolute; right: -50px; top: 50%; width: 50px; height: 1px; background: var(--line-color); z-index: 0; }
  .children > .node { position: relative; padding: 8px 0; }
  .children > .node::before { content: ''; position: absolute; left: -50px; top: 50%; width: 50px; height: 1px; background: var(--line-color); }
  .children > .node::after { content: ''; position: absolute; left: -50px; top: 0; bottom: 0; width: 1px; background: var(--line-color); }
  .children > .node:first-child::after { top: 50%; }
  .children > .node:last-child::after { bottom: 50%; }
  .children > .node:first-child:last-child::after { display: none; }

  .node-progress-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 0 0 8px 8px; overflow: hidden; }
  .node-progress-fill { height: 100%; width: 0%; background-color: transparent; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.6s ease; }

  .btn-left { display: flex; align-items: center; gap: 8px; }
  .icon-circle { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; transition: 0.3s; }
  .icon-white { background: #fff; color: #000; }
  .icon-blue { background: var(--accent-blue); color: #fff; }
  .icon-red { background: var(--accent-red); color: #fff; }
  .icon-insta { background: #E1306C; color: #fff; }
  .icon-face { background: #1877F2; color: #fff; }
  .icon-link { background: #555; color: #fff; } 
  .toggle-icon { font-size: 16px; color: #888; margin-left: 10px; }
  .node > button .toggle-icon::before { content: '⊕'; }
  .node.active > button .toggle-icon::before { content: '⊖'; }

  .link-card {
    display: flex; align-items: center; gap: 8px; background: var(--card-bg);
    border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 65px 8px 8px; 
    text-decoration: none; color: var(--text-main); font-size: 14px; min-width: 240px;
    transition: 0.2s; white-space: nowrap; z-index: 1; position: relative;
  }
  .link-card:hover { background: #151515; border-color: #888; }
  .link-card.visto { border-color: var(--accent-green) !important; background: rgba(40, 167, 69, 0.05) !important; }
  .link-card.visto::after { content: '✔'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--accent-green); font-size: 14px; font-weight: bold; }

  .stamp { position: absolute; right: 32px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--accent-green); font-family: monospace; letter-spacing: 0.5px; }
  .link-text { display: flex; flex-direction: column; }
  .link-url { font-size: 10px; color: #888; margin-top: 2px; }
  .no-children .toggle-icon { display: none; }
  .no-children .node-progress-bar { display: none; } 
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <img src="bpchq_colorido_p_0.png" alt="Brasão BPCHOQUE" onerror="this.style.display='none'">
        <input type="email" id="email" placeholder="E-mail Operacional">
        <input type="password" id="senha" placeholder="Senha">
        <button id="btn-entrar">ENTRAR</button>
        <p id="msg-erro" style="color:var(--accent-red); font-size: 12px; margin-top: 15px;"></p>
    </div>
</div>

<div id="app-content">
  <div class="header-container">
    <div class="header-title">
      AESI BPCHOQUE
      <div class="date-badge" id="data-display">Conectando à nuvem...</div>
      <div class="connection-status" id="connection-status">Aguardando login...</div>
    </div>
    <div class="search-box" onmouseleave="window.recolherBusca()">
      <input type="text" id="campoBusca" class="search-input" placeholder="Buscar alvo/notícia..." oninput="window.realizarBusca()">
      <div class="search-results" id="caixaResultados"></div>
    </div>
  </div>

  <div class="progress-wrapper">
    <div class="progress-header">
      <div class="progress-info">
        <span>Progresso Diário Geral (Sincronizado)</span>
        <span id="progress-text" style="font-weight: normal; color: #aaa;">Carregando...</span>
      </div>
      <div class="action-buttons">
        <button class="btn-action" onclick="window.baixarRelatorio()">📄 Relatório (7 Dias)</button>
        <button class="btn-action btn-logout" id="btn-sair">Deslogar [X]</button>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="workspace-wrapper">
      
      <div class="left-panel">
          <div class="tree-container" id="raiz-arvore"></div>
          
          <div class="stats-container">
            <div class="stat-box">
              <h4>Mais Monitorados da Semana 🔥</h4>
              <ul id="list-top" class="stat-list top">
                <li style="color: #666; justify-content: center;">Aguardando dados...</li>
              </ul>
            </div>
            <div class="stat-box">
              <h4>Menos Monitorados da Semana ⚠️</h4>
              <ul id="list-bottom" class="stat-list bottom">
                <li style="color: #666; justify-content: center;">Aguardando dados...</li>
              </ul>
            </div>
          </div>
      </div>

      <div class="right-panel">
          <div class="stat-box" style="position: sticky; top: 20px;">
              <h4>Calendário 📅</h4>
              <div class="calendar-box">
                  <div class="calendar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px;">
                      <button class="btn-action" onclick="window.mudarMesCalendario(-1)" style="padding: 2px 8px; font-size: 11px;">◀</button>
                      <span id="cal-month-year" style="font-weight: bold; color: var(--accent-yellow); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">---</span>
                      <button class="btn-action" onclick="window.mudarMesCalendario(1)" style="padding: 2px 8px; font-size: 11px;">▶</button>
                  </div>
                  <div class="calendar-weekdays" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: #666; margin-bottom: 8px; font-weight: bold;">
                      <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
                  </div>
                  <div id="calendar-days" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center;"></div>
                  
                  <button class="btn-action" onclick="window.abrirModalCalendarioDireto()" style="width: 100%; margin-top: 15px; background: var(--accent-orange); color: black; font-weight: bold; border: none; padding: 10px; border-radius: 6px;">➕ Agendar Evento</button>
                  
                  <button id="btn-ia-report" class="btn-action" onclick="window.gerarRelatorioIA()" style="width: 100%; margin-top: 8px; background: #00ffaa; color: black; font-weight: bold; border: none; padding: 10px; border-radius: 6px;">🤖 Gerar Relatório IA (7 Dias)</button>

                  <div id="calendar-event-list" style="margin-top: 15px; border-top: 1px solid #222; padding-top: 12px; display: none;">
                      <h5 style="margin: 0 0 8px 0; font-size: 11px; color: var(--accent-orange); text-transform: uppercase; letter-spacing: 0.5px;">Alertas do Dia Selecionado</h5>
                      <div id="cal-events-ul" style="display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; padding-right: 4px;"></div>
                  </div>
              </div>
          </div>
      </div>

  </div>
</div>

<div id="tooltip-preview"></div>

<div id="modal-overlay" onclick="window.fecharModalNota()"></div>
<div id="nota-modal">
    <h4 id="nota-alvo-titulo">Gerenciar Entrada</h4>
    
    <label style="font-size: 11px; color: #888; display: block; margin-bottom: 4px;">Informações / Dados do Alerta:</label>
    <textarea id="nota-textarea" placeholder="Digite os detalhes observacionais..."></textarea>
    
    <div id="container-local">
        <label style="font-size: 11px; color: #888; display: block; margin-bottom: 4px;">📍 Local do Evento:</label>
        <input type="text" id="nota-local" placeholder="Ex: Praça Santos Andrade, Curitiba">
    </div>
    
    <div class="input-linha-dupla" id="container-tempo">
        <div>
            <label>📅 Dia do Evento:</label>
            <input type="date" id="nota-data">
        </div>
        <div>
            <label>⏰ Hora do Evento:</label>
            <input type="time" id="nota-hora">
        </div>
    </div>

    <div id="container-atrelar-movimento" style="margin-bottom: 15px; display: relative; position: relative;">
        <label style="font-size: 11px; color: #888; display: block; margin-bottom: 4px;">🔗 Atrelar a um Movimento (Opcional):</label>
        <input type="text" id="nota-movimento-input" placeholder="Comece a digitar o nome do movimento..." style="width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 6px; outline: none; font-size: 13px; font-weight: bold;" oninput="window.filtrarMovimentosDropdown()">
        <div id="nota-movimento-sugestoes" style="max-height: 140px; overflow-y: auto; background: #0e0e0e; border: 1px solid #333; margin-top: 4px; border-radius: 6px; display: none; position: absolute; left: 0; right: 0; z-index: 30000; box-shadow: 0 5px 15px rgba(0,0,0,0.8);"></div>
    </div>

    <div class="nota-actions">
        <button class="btn-fechar-nota" onclick="window.fecharModalNota()">Cancelar</button>
        <button id="btn-modal-gravar" class="btn-salvar-nota" onclick="window.salvarNotaFirebase()">Gravar Alerta</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBVPuhWEddM3QH3tDCU0IPENF09Kg-_ves",
    authDomain: "aesi-movimentos-sociais.firebaseapp.com",
    databaseURL: "https://aesi-movimentos-sociais-default-rtdb.firebaseio.com",
    projectId: "aesi-movimentos-sociais",
    storageBucket: "aesi-movimentos-sociais.firebasestorage.app",
    messagingSenderId: "957926070108",
    appId: "1:957926070108:web:6673062b6e703d9e741399"
  };

  const app = initializeApp(firebaseConfig);

  window.LISTA_MOVIMENTOS = [];

  let estrelasOrigem = [];

  let tituloAtualNota = "";
  let contextoAtual = "";

  function iniciarSistemaC2() {
      get(ref(db, 'estrutura_arvore')).then(snap => {
          if(snap.exists()) {
              window.DADOS_TOTAIS = snap.val();
              listaTodosAlvos = [];
              window.LISTA_MOVIMENTOS = [];
              extrairTodosOsAlvos(window.DADOS_TOTAIS);
              
              const raiz = document.getElementById('raiz-arvore');
              raiz.innerHTML = "";
              desenhavelArvore(window.DADOS_TOTAIS, raiz, []);
              iniciarMonitoramentoDiario();
          } else {
              document.getElementById('data-display').innerText = "Erro ao carregar os nós da nuvem.";
          }
      }).catch(err => {
          document.getElementById('data-display').innerText = "Erro de Autenticação na Nuvem.";
      });

  function extrairTodosOsAlvos(lista, caminhoAtual = []) {
      if (!Array.isArray(lista)) lista = lista ? Object.values(lista) : [];
      lista.forEach(item => {
          const novoCaminho = [...caminhoAtual, item.nome];
          const temFilhos = item.filhos && item.filhos.length > 0;
          const temLinks = item.links && item.links.length > 0;

          if (novoCaminho[0] === "MOVIMENTOS" && (temFilhos || temLinks) && novoCaminho.length >= 4) {
              window.LISTA_MOVIMENTOS.push({ caminhoStr: novoCaminho.join(' > '), nome: item.nome });
          }

          if (item.links && item.links.length > 0) {
              item.links.forEach(link => {
                  const idUnico = novoCaminho.join(' > ') + " > " + link.url;
                  listaTodosAlvos.push({ id: sanitizarId(idUnico), titulo: novoCaminho.slice(-2).join(' > '), caminho: novoCaminho });
              });
          }
          if (item.filhos) { extrairTodosOsAlvos(item.filhos, novoCaminho); }
      });
  }

  function obterDataBrasiliaISO() { const d = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Sao_Paulo"})); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function obterDataBrasiliaBr() { return new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
  function obterHoraBrasilia() { const d = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Sao_Paulo"})); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  
  function obterSegundaFeiraDaSemana() {
    const d = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Sao_Paulo"}));
    const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
    const monday = new Date(d.setDate(diff));
    return `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
  }
  function sanitizarId(str) { return str ? str.replace(/[.#$\[\]/]/g, "_") : ""; }

  function getCorTermica(pct) {
    if (pct === 0) return 'transparent';
    if (pct <= 10) return 'rgb(220, 53, 69)';
    if (pct <= 40) { let p = (pct - 10) / 30; return `rgb(${Math.round(220 + (255 - 220) * p)}, ${Math.round(53 + (193 - 53) * p)}, ${Math.round(69 + (7 - 69) * p)})`; }
    if (pct <= 70) { let p = (pct - 40) / 30; return `rgb(${Math.round(255 - (255 - 40) * p)}, ${Math.round(193 - (193 - 167) * p)}, ${Math.round(7 + (69 - 7) * p)})`; }
    let p = (pct - 70) / 30; return `rgb(${Math.round(40 - (40 - 0) * p)}, ${Math.round(167 - (167 - 123) * p)}, ${Math.round(69 + (255 - 69) * p)})`;
  }

  const dataHojeISO = obterDataBrasiliaISO();
  const semanaAtualISO = obterSegundaFeiraDaSemana();

  function iniciarMonitoramentoDiario() {
      document.getElementById('data-display').innerText = `Data de Referência (Brasília): ${obterDataBrasiliaBr()}`;

      onValue(ref(db, `monitoramentoDiario/${dataHojeISO}`), (snapshot) => {
        const data = snapshot.val() || {};
        vistosGlobais = data.vistos ? Object.values(data.vistos) : [];
        anotacoesGlobais = data.anotacoes || {}; 
        agendaMenusGlobais = data.agenda_menus || {}; 
        atualizarUiComVistos();
        verificarAlertasExpirados(); 
        if (window.CURRENT_SELECTED_DAY) window.selecionarDiaCalendario(window.CURRENT_SELECTED_DAY);
      });

      onValue(ref(db, 'alertas_calendario'), (snapshot) => {
          alertasCalendarioGlobais = snapshot.val() || {};
          window.renderizarCalendarioTatico();
          verificarAlertasExpirados();
          if (window.CURRENT_SELECTED_DAY) window.selecionarDiaCalendario(window.CURRENT_SELECTED_DAY);
      });

      onValue(ref(db, `estatisticas_semanal/${semanaAtualISO}`), (snapshot) => {
        const dataFirebase = snapshot.val() || {};
        let estatisticasCompletas = listaTodosAlvos.map(alvo => {
            return { titulo: alvo.titulo, count: dataFirebase[alvo.id] ? dataFirebase[alvo.id].count : 0, caminho: alvo.caminho };
        });
        estatisticasCompletas.sort((a, b) => b.count - a.count);
        const top15 = estatisticasCompletas.filter(s => s.count > 0).slice(0, 15);
        const bottom15 =  estatisticasCompletas.slice(-15).reverse();
        
        document.getElementById('list-top').innerHTML = top15.length > 0 
            ? top15.map(s => `<li data-caminho="${s.caminho.join(' > ')}" onclick="window.focarCaminhoDireto(this.getAttribute('data-caminho'))"><span>${s.titulo}</span> <span class="stat-count">${s.count} cliques</span></li>`).join('')
            : '<li style="color: #666; justify-content: center;">Nenhum alvo acessado ainda</li>';
        document.getElementById('list-bottom').innerHTML = bottom15.map(s => `<li data-caminho="${s.caminho.join(' > ')}" onclick="window.focarCaminhoDireto(this.getAttribute('data-caminho'))"><span>${s.titulo}</span> <span class="stat-count">${s.count} cliques</span></li>`).join('');
      });

      onValue(ref(db, 'marcacoesTaticas/estrelas'), (snapshot) => {
          const data = snapshot.val();
          estrelasOrigem = data ? Object.values(data) : [];
          atualizarEstrelasUI();
      });
  }

  function verificarAlertasExpirados() {
      const agoraStr = obterDataBrasiliaISO() + " " + obterHoraBrasilia();
      
      Object.keys(agendaMenusGlobais).forEach(safeKey => {
          const nota = agendaMenusGlobais[safeKey];
          if (nota && nota.dataAlerta && nota.horaAlerta) {
              const alvoStr = nota.dataAlerta + " " + nota.horaAlerta;
              if (alvoStr <= agoraStr && !alertasPromptadosSessao.includes(safeKey)) {
                  alertasPromptadosSessao.push(safeKey); 
                  setTimeout(() => {
                      const dispensar = confirm(`[AGENDA VENCIDA]\nO prazo do evento de "${nota.tituloOrigem}" no local "${nota.local || 'Não Definido'}" expirou.\n\nDeseja REMOVER este alerta da agenda de hoje?`);
                      if (dispensar) set(ref(db, `monitoramentoDiario/${dataHojeISO}/agenda_menus/${safeKey}`), null);
                  }, 600);
              }
          }
      });

      Object.keys(alertasCalendarioGlobais).forEach(keyId => {
          const nota = alertasCalendarioGlobais[keyId];
          if (nota && nota.dataAlerta && nota.horaAlerta) {
              const alvoStr = nota.dataAlerta + " " + nota.horaAlerta;
              if (alvoStr <= agoraStr && !alertasPromptadosSessao.includes(keyId)) {
                  alertasPromptadosSessao.push(keyId);
                  setTimeout(() => {
                      const dispensar = confirm(`[EVENTO CALENDÁRIO VENCIDO]\nO prazo do agendamento direto "${nota.tituloOrigem}" expirou.\n\nDeseja REMOVER este registro da nuvem?`);
                      if (dispensar) set(ref(db, `alertas_calendario/${keyId}`), null);
                  }, 600);
              }
          }
      });
  }

  window.mudarMesCalendario = function(direcao) {
      currentCalMonth += direcao;
      if (currentCalMonth > 11) { currentCalMonth = 0; currentCalYear++; }
      if (currentCalMonth < 0) { currentCalMonth = 11; currentCalYear--; }
      window.renderizarCalendarioTatico();
  };

  /* --- DETECÇÃO AUTOMÁTICA DE LINKS --- */
  function linkify(text) {
      if (!text) return "";
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, function(url) {
          return '<a href="' + url + '" target="_blank">' + url + '</a>';
      });
  }

  function construirItemVisualEvento(nota, keyId, tipoEntrada) {
      const div = document.createElement('div');
      let caminhoFoco = tipoEntrada === 'direto' ? (nota.movimentoAtrelado || "") : (nota.pathString || "");
      let cursorStyle = caminhoFoco ? "cursor: pointer;" : "";
      let subSeloCaminho = caminhoFoco ? `<div style="font-size: 10px; color: var(--accent-blue); margin-top: 5px; font-weight: bold;">🔗 Focar: ${caminhoFoco.replace("MOVIMENTOS > ", "")}</div>` : "";

      div.style.cssText = `background: #111; border-left: 3px solid ${tipoEntrada === 'direto' ? 'var(--accent-yellow)' : 'var(--accent-orange)'}; padding: 10px; border-radius: 0 4px 4px 0; font-size: 12px; line-height: 1.4; box-sizing: border-box; ${cursorStyle}`;
      if (caminhoFoco) { div.setAttribute('onclick', `window.focarCaminhoDireto('${caminhoFoco}')`); }

      div.innerHTML = `
          <div style="font-weight: bold; color: var(--accent-yellow); display: flex; justify-content: space-between; align-items: center;">
              <span>${nota.tituloOrigem || 'Evento Geral'}</span>
              <div style="display: flex; align-items: center; gap: 6px;">
                  <span class="btn-editar-card" style="cursor: pointer; font-size: 11px; background: #222; padding: 2px 6px; border-radius: 4px; color: var(--accent-yellow); border: 1px solid #444; font-weight: bold;" title="Editar este compromisso">✏️ Editar</span>
                  <span style="font-size: 9px; background: #222; padding: 3px 4px; border-radius: 3px; color: #aaa; font-family: monospace;">${tipoEntrada === 'direto' ? 'Direto' : 'Pasta'}</span>
              </div>
          </div>
          <div style="color: #fff; margin: 6px 0; white-space: pre-wrap;">"${linkify(nota.texto) || 'Sem descrição'}"</div>
          <div style="font-size: 10px; color: #888;">📍 Local: ${nota.local || 'Não informado'}</div>
          <div style="font-size: 10px; color: #888;">⏰ Hora: ${nota.horaAlerta || '--:--'} | Op: ${nota.operador.split('@')[0]}</div>
          ${subSeloCaminho}
      `;

      // Evento isolado para o botão de edição evitar bolha de foco na árvore
      div.querySelector('.btn-editar-card').addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          window.abrirModalTatico(e, keyId, nota.tituloOrigem || 'Evento Geral', tipoEntrada === 'direto' ? 'direto' : 'agenda');
      });

      return div;
  }

  window.selecionarDiaCalendario = function(dataStr) {
      window.CURRENT_SELECTED_DAY = dataStr;
      const listaEvs = document.getElementById('cal-events-ul');
      const containerEvs = document.getElementById('calendar-event-list');
      listaEvs.innerHTML = ""; let encontrou = false;

      Object.keys(agendaMenusGlobais).forEach(key => {
          const nota = agendaMenusGlobais[key];
          if (nota && nota.dataAlerta === dataStr) { encontrou = true; listaEvs.appendChild(construirItemVisualEvento(nota, key, 'pasta')); }
      });

      Object.keys(alertasCalendarioGlobais).forEach(key => {
          const nota = alertasCalendarioGlobais[key];
          if (nota && nota.dataAlerta === dataStr) { encontrou = true; listaEvs.appendChild(construirItemVisualEvento(nota, key, 'direto')); }
      });

      containerEvs.style.display = encontrou ? 'block' : 'none';
  };

  window.renderizarCalendarioTatico = function() {
      const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      document.getElementById('cal-month-year').innerText = `${meses[currentCalMonth]} ${currentCalYear}`;
      const gridDays = document.getElementById('calendar-days'); gridDays.innerHTML = "";
      const primeiroDiaSemana = new Date(currentCalYear, currentCalMonth, 1).getDay();
      const totalDiasMes = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();
      
      for (let i = 0; i < primeiroDiaSemana; i++) {
          const emptyDiv = document.createElement('div'); emptyDiv.className = 'calendar-day empty'; gridDays.appendChild(emptyDiv);
      }
      
      const hojeLocal = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Sao_Paulo"}));
      for (let day = 1; day <= totalDiasMes; day++) {
          const dateStr = `${currentCalYear}-${String(currentCalMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          const dayDiv = document.createElement('div'); dayDiv.innerText = day;
          dayDiv.style.cssText = "background: #111; border: 1px solid #222; border-radius: 4px; padding: 6px 0; font-size: 11px; color: #ccc; transition: all 0.2s; user-select: none;";
          
          if (currentCalYear === hojeLocal.getFullYear() && currentCalMonth === hojeLocal.getMonth() && day === hojeLocal.getDate()) {
              dayDiv.style.borderColor = "var(--accent-blue)"; dayDiv.style.color = "var(--accent-blue)";
          }

          let temAlertaNoDia = false;
          Object.keys(agendaMenusGlobais).forEach(key => { if (agendaMenusGlobais[key] && agendaMenusGlobais[key].dataAlerta === dateStr) temAlertaNoDia = true; });
          Object.keys(alertasCalendarioGlobais).forEach(key => { if (alertasCalendarioGlobais[key] && alertasCalendarioGlobais[key].dataAlerta === dateStr) temAlertaNoDia = true; });

          if (temAlertaNoDia) {
              dayDiv.style.borderColor = "var(--accent-orange)"; dayDiv.style.background = "rgba(255, 140, 0, 0.15)";
              dayDiv.style.color = "#fff"; dayDiv.style.fontWeight = "bold"; dayDiv.style.cursor = "pointer";
              dayDiv.onclick = () => window.selecionarDiaCalendario(dateStr);
              dayDiv.onmouseenter = function() { this.style.background = "rgba(255, 140, 0, 0.3)"; this.style.boxShadow = "0 0 8px var(--accent-orange)"; };
              dayDiv.onmouseleave = function() { this.style.background = "rgba(255, 140, 0, 0.15)"; this.style.boxShadow = "none"; };
          }
          gridDays.appendChild(dayDiv);
      }
  };

  window.filtrarMovimentosDropdown = function() {
      const input = document.getElementById('nota-movimento-input').value;
      const box = document.getElementById('nota-movimento-sugestoes');
      box.innerHTML = "";

      if (input.trim().length === 0) { box.style.display = 'none'; return; }

      const termoFormatado = normalizarTexto(input);
      const filtrados = window.LISTA_MOVIMENTOS.filter(mov => normalizarTexto(mov.caminhoStr).includes(termoFormatado));

      if (filtrados.length === 0) { box.style.display = 'none'; return; }

      filtrados.forEach(mov => {
          const itemDiv = document.createElement('div');
          itemDiv.style.cssText = "padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #1a1a1a; font-size: 12px; color: #ccc; transition: 0.15s; text-align: left;";
          itemDiv.innerText = mov.caminhoStr.replace("MOVIMENTOS > ", "");
          
          itemDiv.onmouseenter = function() { this.style.background = "#1c1c1c"; this.style.color = "var(--accent-yellow)"; };
          itemDiv.onmouseleave = function() { this.style.background = "transparent"; this.style.color = "#ccc"; };
          
          itemDiv.onclick = function() {
              document.getElementById('nota-movimento-input').value = mov.caminhoStr;
              box.style.display = 'none';
          };
          box.appendChild(itemDiv);
      });
      box.style.display = 'block';
  };

  window.abrirModalCalendarioDireto = function() {
      contextoAtual = 'direto'; alvoAtualNota = "";
      document.getElementById('nota-alvo-titulo').innerText = "Agendar Novo Evento";
      document.getElementById('nota-textarea').value = ""; document.getElementById('nota-local').value = "";
      document.getElementById('nota-data').value = ""; document.getElementById('nota-hora').value = "";
      document.getElementById('nota-movimento-input').value = "";
      document.getElementById('nota-movimento-sugestoes').style.display = 'none';

      document.getElementById('container-local').style.display = 'block';
      document.getElementById('container-tempo').style.display = 'flex';
      document.getElementById('container-atrelar-movimento').style.display = 'block';
      
      document.getElementById('btn-modal-gravar').style.display = 'block';
      document.getElementById('btn-modal-gravar').innerText = "Gravar Alerta";

      document.getElementById('modal-overlay').style.display = 'block';
      document.getElementById('nota-modal').style.display = 'block';
      document.getElementById('nota-textarea').focus();
  };

  window.focarCaminhoDireto = function(caminhoCompletoStr) {
      if (!caminhoCompletoStr) return;
      const pastas = caminhoCompletoStr.split(' > ');
      document.querySelectorAll('.node').forEach(node => node.classList.remove('active'));
      let c = "";
      pastas.forEach((pasta, idx) => {
          c += (idx === 0 ? "" : " > ") + pasta;
          const n = document.querySelector(`.node[data-path="${c}"]`); if (n) n.classList.add('active');
      });
      const target = document.querySelector(`.node[data-path="${caminhoCompletoStr}"]`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  window.clicarEstrela = function(e, idElemento) {
      e.preventDefault(); e.stopPropagation();
      if (!Array.isArray(estrelasOrigem)) estrelasOrigem = estrelasOrigem ? Object.values(estrelasOrigem) : [];
      if (estrelasOrigem.includes(idElemento)) {
          estrelasOrigem = estrelasOrigem.filter(orig => orig !== idElemento); set(ref(db, 'marcacoesTaticas/estrelas'), estrelasOrigem);
      } else {
          if (!estrelasOrigem.some(orig => idElemento.startsWith(orig + " > ") || orig.startsWith(idElemento + " > "))) {
              estrelasOrigem.push(idElemento); set(ref(db, 'marcacoesTaticas/estrelas'), estrelasOrigem);
          }
      }
  };

  function atualizarEstrelasUI() {
      if (!Array.isArray(estrelasOrigem)) estrelasOrigem = estrelasOrigem ? Object.values(estrelasOrigem) : [];
      document.querySelectorAll('.star-icon').forEach(el => {
          const id = el.getAttribute('data-star'); el.classList.remove('star-orange', 'star-yellow');
          if (estrelasOrigem.includes(id)) el.classList.add('star-orange');
          else if (estrelasOrigem.some(orig => id.startsWith(orig + " > ") || orig.startsWith(id + " > "))) el.classList.add('star-yellow');
      });
  }

  window.esconderTooltipTatico = function() { document.getElementById('tooltip-preview').classList.remove('show'); };

  window.abrirModalTatico = function(e, idUnico, titulo, tipo) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      window.esconderTooltipTatico();
      contextoAtual = tipo; alvoAtualNota = idUnico; tituloAtualNota = titulo;
      const safeKey = sanitizarId(idUnico);
      
      document.getElementById('container-atrelar-movimento').style.display = 'none';
      document.getElementById('btn-modal-gravar').style.display = 'block';
      document.getElementById('btn-modal-gravar').innerText = "Gravar Alerta";

      if (tipo === 'postit') {
          document.getElementById('nota-alvo-titulo').innerText = "Nota (Post-it): " + titulo;
          const nota = anotacoesGlobais[safeKey] || {};
          document.getElementById('nota-textarea').value = nota.texto || "";
          document.getElementById('container-local').style.display = 'none';
          document.getElementById('container-tempo').style.display = 'none';

          document.getElementById('nota-local').value = nota.local || "";
          document.getElementById('nota-data').value = nota.dataAlerta || "";
          document.getElementById('nota-hora').value = nota.horaAlerta || "";
          document.getElementById('container-local').style.display = 'block';

          document.getElementById('nota-textarea').value = nota.texto || "";
          document.getElementById('nota-local').value = nota.local || "";
          document.getElementById('nota-data').value = nota.dataAlerta || "";
          document.getElementById('nota-hora').value = nota.horaAlerta || "";
          document.getElementById('nota-movimento-input').value = nota.movimentoAtrelado || "";
          
          document.getElementById('container-local').style.display = 'block';
          document.getElementById('container-tempo').style.display = 'flex';
          document.getElementById('container-atrelar-movimento').style.display = 'block';
          document.getElementById('nota-movimento-sugestoes').style.display = 'none';
      }
      
      document.getElementById('modal-overlay').style.display = 'block';
      document.getElementById('nota-modal').style.display = 'block';
      document.getElementById('nota-textarea').focus();
  };

  window.mostrarTooltipTatico = function(e, idUnico, tipo) {
      e.stopPropagation();
      const safeKey = sanitizarId(idUnico);
      const data = tipo === 'postit' ? anotacoesGlobais[safeKey] : agendaMenusGlobais[safeKey];
      if (!data) return;

      const tooltip = document.getElementById('tooltip-preview');
      if (tipo === 'postit') {
          tooltip.innerHTML = `
              <div class="tooltip-title" style="color: var(--accent-red); border-bottom-color: var(--accent-red);">NOTA (POST-IT)</div>
              <div style="color: #ffffff; font-weight: bold; font-size: 13px; margin-bottom: 6px; white-space: pre-wrap; line-height: 1.4;">"${linkify(data.texto) || 'Sem descrição'}"</div>
              <div style="font-size: 10px; color: #aaa; border-top: 1px solid #222; padding-top: 4px;">🎯 Operador: ${data.operador.split('@')[0]} | ⏰ Registro: ${data.time}</div>
          `;
      } else {
          tooltip.innerHTML = `
              <div class="tooltip-title" style="color: var(--accent-yellow); border-bottom-color: var(--accent-yellow);">AGENDA DE EVENTO</div>
              <div style="color: #ffffff; font-weight: bold; font-size: 13px; margin-bottom: 6px; white-space: pre-wrap; line-height: 1.4;">"${linkify(data.texto) || 'Sem descrição'}"</div>
              <div style="font-size: 11px; color: var(--accent-orange); margin-bottom: 3px;">📍 Local: ${data.local || 'Não informado'}</div>
              <div style="font-size: 11px; color: var(--accent-blue); margin-bottom: 6px;">📅 Evento: ${data.dataAlerta.split('-').reverse().join('/')} às ${data.horaAlerta || '--:--'}</div>
              <div style="font-size: 10px; color: #aaa; border-top: 1px solid #222; padding-top: 4px;">🎯 Operador: ${data.operador.split('@')[0]} | ⏰ Registro: ${data.time}</div>
          `;
      }
      tooltip.style.left = (e.clientX + 15) + 'px'; tooltip.style.top = (e.clientY + 10) + 'px'; tooltip.classList.add('show');
  };

  window.fecharModalNota = function() {
      document.getElementById('modal-overlay').style.display = 'none';
      document.getElementById('nota-modal').style.display = 'none';
  };

  window.salvarNotaFirebase = function() {
      const texto = document.getElementById('nota-textarea').value.trim();
      const local = document.getElementById('nota-local').value.trim();
      const dataAlerta = document.getElementById('nota-data').value;
      const horaAlerta = document.getElementById('nota-hora').value;
      const safeKey = sanitizarId(alvoAtualNota);
      const user = auth.currentUser ? auth.currentUser.email : 'Desconhecido';

      if (contextoAtual === 'direto') {
          const movimentoAtrelado = document.getElementById('nota-movimento-input').value.trim();
          const uniqueKey = alvoAtualNota || ("CAL_" + Date.now()); 
          const notaRef = ref(db, `alertas_calendario/${uniqueKey}`);
          
          if (texto === "" && local === "" && dataAlerta === "" && horaAlerta === "") {
              set(notaRef, null);
          } else {
              set(notaRef, { 
                  texto, local, dataAlerta, horaAlerta, movimentoAtrelado, operador: user, 
                  time: obterHoraBrasilia(), tituloOrigem: movimentoAtrelado ? movimentoAtrelado.split(' > ').pop() : "Evento Geral", isDirectCalendar: true, keyId: uniqueKey
              });
          }
      } else if (contextoAtual === 'postit') {
          const notaRef = ref(db, `monitoramentoDiario/${dataHojeISO}/anotacoes/${safeKey}`);
          if (texto === "") set(notaRef, null);
          else set(notaRef, { texto, operador: user, time: obterHoraBrasilia(), tituloOrigem: tituloAtualNota });
      } else if (contextoAtual === 'agenda') {
          const notaRef = ref(db, `monitoramentoDiario/${dataHojeISO}/agenda_menus/${safeKey}`);
          if (texto === "" && local === "" && dataAlerta === "" && horaAlerta === "") set(notaRef, null);
          else set(notaRef, { texto, local, dataAlerta, horaAlerta, operador: user, time: obterHoraBrasilia(), tituloOrigem: tituloAtualNota, pathString: alvoAtualNota });
      }
      window.fecharModalNota();
  };

  function atualizarUiComVistos() {
    document.querySelectorAll('.link-card').forEach(el => {
        el.classList.remove('visto'); const stamp = el.querySelector('.stamp'); if(stamp) stamp.remove();
    });

    vistosGlobais.forEach(v => {
      const el = document.querySelector(`.link-card[data-id="${v.id}"]`);
      if (el) { el.classList.add('visto'); let stamp = document.createElement('span'); stamp.className = 'stamp'; stamp.innerText = `[${v.time}]`; el.appendChild(stamp); }
    });

    document.querySelectorAll('.icon-agenda').forEach(el => {
        if (agendaMenusGlobais[sanitizarId(el.getAttribute('data-id'))]) el.classList.add('tem-nota');
        else el.classList.remove('tem-nota');
    });
    document.querySelectorAll('.icon-postit').forEach(el => {
        if (anotacoesGlobais[sanitizarId(el.getAttribute('data-id'))]) el.classList.add('tem-nota');
        else el.classList.remove('tem-nota');
    });

    document.querySelectorAll('.node').forEach(node => {
        const linksDentro = node.querySelectorAll('.link-card');
        if (linksDentro.length > 0 && !node.classList.contains('no-children')) {
            const vistosDentro = node.querySelectorAll('.link-card.visto');
            const pct = (vistosDentro.length / linksDentro.length) * 100;
            const fill = node.querySelector(':scope > button > .node-progress-bar > .node-progress-fill');
            if (fill) { fill.style.width = `${pct}%`; fill.style.backgroundColor = getCorTermica(pct); }
        }
    });

    const totalLinks = document.querySelectorAll('.link-card').length;
    const fill = document.getElementById('progress-fill'); const text = document.getElementById('progress-text');
    if (totalLinks === 0) return; 
    const porcentagem = Math.round((vistosGlobais.length / totalLinks) * 100);
    fill.style.width = `${porcentagem}%`;
    text.innerHTML = porcentagem >= 100 ? `<span style="color: var(--accent-green); font-weight: bold;">MONITORAMENTO GERAL CONCLUÍDO (100%) ✔️</span>` : `${vistosGlobais.length} / ${totalLinks} verificados (${porcentagem}%)`;

    window.renderizarCalendarioTatico();
  }

  window.registrarVisualizacao = function(idUnico, tituloLink) {
    if (!vistosGlobais.some(v => v.id === idUnico)) {
      set(ref(db, `monitoramentoDiario/${dataHojeISO}/vistos`), [...vistosGlobais, { id: idUnico, time: obterHoraBrasilia(), operador: auth.currentUser ? auth.currentUser.email : 'Desconhecido' }]);
    }
    if (idUnico.startsWith("MOVIMENTOS")) {
        const safeKey = sanitizarId(idUnico); const statRef = ref(db, `estatisticas_semanal/${semanaAtualISO}/${safeKey}`);
        get(statRef).then(snap => { set(statRef, { titulo: tituloLink, count: (snap.exists() ? snap.val().count : 0) + 1 }); });
    }
  };

  window.baixarRelatorio = function() {
    get(ref(db, 'monitoramentoDiario')).then(snap => {
        if(!snap.exists()) return;
        const dados = snap.val(); let relatorio = "RELATÓRIO DE MONITORAMENTO E INTELIGÊNCIA - AESI BPCHOQUE\n\n";
        Object.keys(dados).sort().slice(-7).forEach(d => {
            relatorio += `[ DATA: ${d.split('-').reverse().join('/')} ]\n`;
            const vistos = (dados[d] && dados[d].vistos) ? Object.values(dados[d].vistos) : [];
            relatorio += `-> Total de fontes verificadas: ${vistos.length}\n`;
            vistos.forEach(v => { relatorio += ` - ${v.time} | ${v.id.split(' > ').slice(-2, -1)[0]}${v.operador ? ` | Op: ${v.operador}` : ''}\n`; });
            
            if (dados[d].anotacoes) {
                relatorio += `\n   *** NOTAS (POST-IT) DO DIA ***\n`;
                Object.values(dados[d].anotacoes).forEach(n => { relatorio += `   [💬] ${n.time} | ${n.tituloOrigem}: "${n.texto}" (Op: ${n.operador.split('@')[0]})\n`; });
            }
            if (dados[d].agenda_menus) {
                relatorio += `\n   *** EVENTOS AGENDADOS (AGENDA) DO DIA ***\n`;
                Object.values(dados[d].agenda_menus).forEach(n => { relatorio += `   [📅] ${n.time} | ${n.tituloOrigem} | Local: ${n.local || 'Não Informado'} | Data: ${n.dataAlerta.split('-').reverse().join('/')} às ${n.horaAlerta} (Op: ${n.operador.split('@')[0]})\n`; });
            }
            relatorio += "\n------------------------------------------------\n\n";
        });
        const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([relatorio], {type: "text/plain;charset=utf-8"}));
        a.download = `Relatorio_Inteligencia_AESI_7_Dias.txt`; a.click();
    });
  }

  window.toggle = function(btn) { btn.parentElement.classList.toggle('active'); };
  window.mostrarTooltipPreview = function(item, btn) {
    if (btn.parentElement.classList.contains('active')) return;
    const tooltip = document.getElementById('tooltip-preview'); let htmlContent = '<ul class="tooltip-list">';
    if (item.filhos && item.filhos.length > 0) item.filhos.forEach(f => htmlContent += `<li>● ${f.nome}</li>`);
    else if (item.links && item.links.length > 0) item.links.forEach(l => htmlContent += `<li>🔗 Links Internos</li>`);
    tooltip.innerHTML = htmlContent + '</ul>'; const rect = btn.getBoundingClientRect();
    tooltip.style.left = (rect.right + 15) + 'px'; tooltip.style.top = rect.top + 'px'; tooltip.classList.add('show');
  };
  window.esconderTooltipPreview = function() { document.getElementById('tooltip-preview').classList.remove('show'); };
  window.recolherArvoreInteira = function() { document.querySelectorAll('.node').forEach(node => { const p = node.getAttribute('data-path'); if (p !== "MOVIMENTOS" && p !== "NOTÍCIAS") node.classList.remove('active'); }); };
  function normalizarTexto(t) { return t ? t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : ""; }
  
  function vasculharArvore(lista, termo, caminhoAtual = [], resultados = []) {
    const termoFormatado = normalizarTexto(termo);
    if (!Array.isArray(lista)) lista = lista ? Object.values(lista) : [];
    lista.forEach(item => {
      const novoCaminho = [...caminhoAtual, item.nome];
      if (normalizarTexto(item.nome).includes(termoFormatado)) resultados.push({ item: item, caminho: novoCaminho });
      if (item.filhos && item.filhos.length > 0) vasculharArvore(item.filhos, termo, novoCaminho, resultados);
    });
    return resultados;
  }

  window.realizarBusca = function() {
    const input = document.getElementById('campoBusca').value; const caixa = document.getElementById('caixaResultados');
    if (input.length < 2) { caixa.style.display = 'none'; window.recolherArvoreInteira(); return; }
    caixa.innerHTML = '';
    vasculharArvore(window.DADOS_TOTAIS, input).forEach(res => {
        const div = document.createElement('div'); div.className = 'search-item';
        div.innerHTML = `<div class="search-item-title">${res.item.nome}</div><div class="search-item-path">${res.caminho.join(' > ')}</div>`;
        div.onclick = () => {
          window.recolherArvoreInteira(); let c = ""; 
          res.caminho.forEach((p, idx) => { c += (idx === 0 ? "" : " > ") + p; const node = document.querySelector(`.node[data-path="${c}"]`); if(node) node.classList.add('active'); });
          const target = document.querySelector(`.node[data-path="${res.caminho.join(' > ')}"]`);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          caixa.style.display = 'none';
        };
        caixa.appendChild(div);
    });
    caixa.style.display = 'block';
  };

  /* =========================================
     SISTEMA DE RENDERIZAÇÃO DA ÁRVORE 100% REVISADO
     ========================================= */
  function desenhavelArvore(listaDeDados, elementoPai, caminhoAtual = []) {
    if (!Array.isArray(listaDeDados)) listaDeDados = listaDeDados ? Object.values(listaDeDados) : [];

    listaDeDados.forEach(item => {
      const novoCaminho = [...caminhoAtual, item.nome]; const pathString = novoCaminho.join(' > ');
      const nodeDiv = document.createElement('div'); nodeDiv.className = 'node'; nodeDiv.setAttribute('data-path', pathString); 
      if (item.isRoot) nodeDiv.classList.add('active');
      const temFilhos = item.filhos && item.filhos.length > 0; const temLinks = item.links && item.links.length > 0;
      if (!temFilhos && !temLinks) nodeDiv.classList.add('no-children');
      const btn = document.createElement('button'); btn.onclick = function(e) { e.stopPropagation(); window.toggle(this); };
      
      if (temFilhos || temLinks) {
        btn.onmouseenter = function() { window.mostrarTooltipPreview(item, this); }; btn.onmouseleave = function() { window.esconderTooltipPreview(); };
        btn.innerHTML = `<div class="node-progress-bar"><div class="node-progress-fill"></div></div>`;
      }

      let htmlNota = "";
      if (novoCaminho[0] === "MOVIMENTOS" && (temFilhos || temLinks) && novoCaminho.length >= 4) {
          htmlNota = `
            <span class="icon-nota icon-agenda" data-id="${pathString}" onclick="window.abrirModalTatico(event, '${pathString}', '${item.nome}', 'agenda')" onmouseenter="window.mostrarTooltipTatico(event, '${pathString}', 'agenda')" onmouseleave="window.esconderTooltipTatico()">📅</span>
            <span class="icon-nota icon-postit" data-id="${pathString}" onclick="window.abrirModalTatico(event, '${pathString}', '${item.nome}', 'postit')" onmouseenter="window.mostrarTooltipTatico(event, '${pathString}', 'postit')" onmouseleave="window.esconderTooltipTatico()">💬</span>
          `;
      }

      btn.innerHTML += `<div class="btn-left"><span class="star-icon" data-star="${pathString}" onclick="window.clicarEstrela(event, this.getAttribute('data-star'))">★</span><div class="icon-circle icon-${item.cor || 'white'}">${item.icone || '●'}</div><span>${item.nome}</span>${htmlNota}</div><span class="toggle-icon"></span>`;
      nodeDiv.appendChild(btn);

      if (temFilhos || temLinks) {
        const childrenDiv = document.createElement('div'); childrenDiv.className = 'children';
        if (temLinks) {
          item.links.forEach(link => {
            const linkNode = document.createElement('div'); linkNode.className = 'node no-children';
            const a = document.createElement('a'); const idUnico = pathString + " > " + link.url;
            a.href = link.url || '#'; a.target = '_blank'; a.className = 'link-card'; a.setAttribute('data-id', idUnico);
            a.onclick = () => window.registrarVisualizacao(idUnico, novoCaminho.slice(-2).join(' > '));
            
            a.innerHTML = `
              <span class="star-icon" data-star="${idUnico}" onclick="window.clicarEstrela(event, this.getAttribute('data-star'))">★</span>
              <div class="icon-circle icon-${link.tipo === 'link' ? 'link' : 'insta'}">${link.tipo === 'insta' ? '📸' : '🔗'}</div>
              <div class="link-text"><span>${link.tipo === 'insta' ? 'Instagram' : 'Website'}</span><span class="link-url">${link.textoUrl || ''}</span></div>
            `;
            linkNode.appendChild(a); childrenDiv.appendChild(linkNode); 
          });
        }
        if (temFilhos) desenhavelArvore(item.filhos, childrenDiv, novoCaminho);
        nodeDiv.appendChild(childrenDiv);
      }
      elementoPai.appendChild(nodeDiv);
    });
  }

  /* =========================================
     SISTEMA DE INTELIGÊNCIA ARTIFICIAL (GEMINI 2.5 FLASH)
     ========================================= */
  window.gerarRelatorioIA = async function() {
      const btn = document.getElementById('btn-ia-report');
      const backupText = btn.innerText;
      btn.innerText = "🤖 Analisando Cenários...";
      btn.disabled = true;

      try {
          const snapChave = await get(ref(db, 'config/gemini_key'));
          if (!snapChave.exists() || snapChave.val().trim() === "") {
              alert("A IA ainda não foi configurada no cofre.");
              btn.innerText = backupText; btn.disabled = false;
              return;
          }
          // Trim limpa os espaços fantasmas e quebras de linha indesejadas automagicamente
          const apiKey = snapChave.val().trim();

          let datasAlvo = [];
          for (let i = 0; i < 7; i++) {
              const d = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Sao_Paulo"}));
              d.setDate(d.getDate() + i);
              datasAlvo.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
          }

          let pacotesEventos = [];
          Object.values(agendaMenusGlobais).forEach(ev => { if (ev && datasAlvo.includes(ev.dataAlerta)) pacotesEventos.push(ev); });
          Object.values(alertasCalendarioGlobais).forEach(ev => { if (ev && datasAlvo.includes(ev.dataAlerta)) pacotesEventos.push(ev); });

          if (pacotesEventos.length === 0) {
              alert("Não existem eventos agendados para os próximos 7 dias.");
              btn.innerText = backupText; btn.disabled = false;
              return;
          }

          const prompt = `Você é uma Inteligência Artificial analista de dados. Analise a seguinte lista de eventos e manifestações agendadas para os próximos 7 dias e crie um Relatório Sintético de Cenários Ocultando jargões desnecessários. Organize estritamente por Ordem Cronológica de Dias, resumindo os principais alvos (movimentos envolvidos), horários e os locais citados. Seja muito direto, formal e objetivo. Use tópicos claros. Eventos para análise: ${JSON.stringify(pacotesEventos)}`;

          const resposta = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });

          const dataIa = await resposta.json();
          if (!dataIa.candidates || dataIa.candidates.length === 0) { throw new Error("Retorno inválido."); }
          
          const relatorioFormatado = dataIa.candidates[0].content.parts[0].text;

          document.getElementById('nota-alvo-titulo').innerText = "🤖 Relatório Analítico IA (Próximos 7 Dias)";
          document.getElementById('nota-textarea').value = relatorioFormatado;
          document.getElementById('container-local').style.display = 'none';
          document.getElementById('container-tempo').style.display = 'none';
          document.getElementById('container-atrelar-movimento').style.display = 'none';
          
          const btnGravar = document.getElementById('btn-modal-gravar');
          btnGravar.innerText = "📋 Copiar Relatório";
          btnGravar.onclick = function() {
              navigator.clipboard.writeText(relatorioFormatado);
              alert("Copiado com sucesso!");
          };

          document.getElementById('modal-overlay').style.display = 'block';
          document.getElementById('nota-modal').style.display = 'block';

      } catch (err) {
          alert("Falha de Comunicação com os servidores da Inteligência Artificial Google. Verifique a console.");
          console.error(err);
      }

      btn.innerText = backupText; btn.disabled = false;
  };

  document.addEventListener('click', (e) => { 
      if (!e.target.closest('.search-box')) document.getElementById('caixaResultados').style.display = 'none'; 
      if (!e.target.closest('#container-atrelar-movimento')) {
          const sug = document.getElementById('nota-movimento-sugestoes'); if (sug) sug.style.display = 'none';
      }
  });
</script>
